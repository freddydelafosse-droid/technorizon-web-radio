<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020711"><title>Technorizon Sound Tour</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;background:#020711;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#app{width:100%;max-width:620px;height:100dvh;margin:auto;background:#020711;position:relative}.bar{height:64px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #19e8ff66;background:#020711}.logo{flex:1;font-weight:1000;font-style:italic;color:#20eaff;font-size:18px}.logo b{color:#ff31cf}.b{border:1px solid #20eaff88;background:#071326;color:#fff;border-radius:14px;height:44px;padding:0 12px;font-weight:900;text-decoration:none;display:grid;place-items:center}.stat{background:#091326;border:1px solid #ffffff22;border-radius:14px;padding:7px 9px;font-size:12px;font-weight:900}.game{height:calc(100dvh - 64px);position:relative}.hud{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:none}.hud span{background:#020711df;border:1px solid #ffffff2a;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.hud .city{width:100%;text-align:center;color:#fff;border-color:#20eaff88;font-size:14px}.hint{position:absolute;z-index:5;bottom:10px;left:5%;right:5%;padding:8px;background:#020711d9;border-radius:999px;text-align:center;font-size:12px;color:#d7e2ed;pointer-events:none}.share{position:absolute;z-index:8;right:10px;bottom:54px}.modal{position:absolute;z-index:20;inset:0;background:#020711f2;display:grid;place-items:center;padding:18px}.hidden{display:none!important}.card{width:min(94%,470px);text-align:center}.card h1{color:#20eaff}.btn{border:0;border-radius:999px;padding:14px 24px;font-weight:1000;font-size:16px;background:linear-gradient(90deg,#20eaff,#ff31cf);color:#06101b}.roomScene{width:100%;height:60vh;position:relative;overflow:hidden;border:1px solid #20eaff66;border-radius:22px;background:url('/assets/sound-tour/club-room.svg') center/cover no-repeat}.gear{position:absolute;opacity:0;transform:translateY(30px) scale(.8);transition:.65s}.gear.on{opacity:1;transform:none}.sp{width:22%;bottom:24%}.sp.l{left:10%}.sp.r{right:10%}.sub{width:27%;bottom:10%}.sub.l{left:20%}.sub.r{right:20%}.dj{position:absolute;left:31%;right:31%;bottom:25%;height:15%;background:linear-gradient(145deg,#0b0e13,#343b45);border:2px solid #20eaff;display:grid;place-items:center;font-weight:1000;color:#20eaff}.prog{height:8px;background:#ffffff18;border-radius:9px;overflow:hidden;margin:10px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#20eaff,#ff31cf)}#phaser{width:100%;height:100%}
</style></head><body><main id="app"><header class="bar"><a class="b" href="/techno-arcade.html">‹</a><div class="logo">TECHNORIZON<b>.FR</b></div><span class="stat">🪙 <b id="coins">0</b></span><span class="stat">🏆 <b id="cups">0</b></span></header><section class="game"><div id="phaser"></div><div class="hud"><span class="city">📍 <b id="city"></b> · NIVEAU <b id="level"></b></span><span>💣 <b id="shots"></b></span><span>📦 <b id="remain"></b></span><span>⭐ <b id="score"></b></span></div><div class="hint">Glisse depuis le canon pour viser · relâche pour tirer 💥</div><button class="b share" id="share">↗ Partager ce jeu</button><div class="modal" id="intro"><div class="card"><h1>SOUND TOUR</h1><p>Un vrai moteur physique : vise la structure et fais-la s'effondrer avec tes boulets.</p><button class="btn" id="start">JOUER</button></div></div><div class="modal hidden" id="room"><div class="card"><h1>🏆 NIVEAU RÉUSSI !</h1><p id="reward"></p><div class="roomScene"><img class="gear sp l" data-s="2" src="/assets/sound-tour/speaker.svg"><img class="gear sp r" data-s="4" src="/assets/sound-tour/speaker.svg"><img class="gear sub l" data-s="3" src="/assets/sound-tour/speaker.svg"><img class="gear sub r" data-s="5" src="/assets/sound-tour/speaker.svg"><div class="gear dj" data-s="1">TECHNORIZON DJ</div></div><b id="roomTxt"></b><div class="prog"><i id="prog"></i></div><button class="btn" id="next">NIVEAU SUIVANT ›</button></div></div><div class="modal hidden" id="fail"><div class="card"><h1>PLUS DE BOULETS</h1><button class="btn" id="retry">RÉESSAYER</button></div></div></section></main>
<script>
const $=s=>document.querySelector(s),cities=['PARIS','LONDRES','BERLIN','IBIZA','AMSTERDAM','NEW YORK','MIAMI','TOKYO','LOS ANGELES','DUBAÏ'];let level=+(localStorage.getItem('soundtour-level')||1),coins=+(localStorage.getItem('soundtour-coins')||0),cups=+(localStorage.getItem('soundtour-cups')||0),shots=6,score=0,scene,ball=null,targets=[],aiming=false,startP=null,won=false;
function ui(){$('#level').textContent=level;$('#city').textContent=cities[Math.floor((level-1)/50)%cities.length];$('#coins').textContent=coins;$('#cups').textContent=cups;$('#shots').textContent='TIRS '+shots;$('#remain').textContent='RESTE '+targets.filter(o=>o.active).length;$('#score').textContent=score}
class SoundTour extends Phaser.Scene{preload(){this.load.svg('cannon','/assets/sound-tour/cannon.svg');this.load.svg('speaker','/assets/sound-tour/speaker.svg');this.load.svg('flight','/assets/sound-tour/flightcase.svg')}create(){scene=this;this.cameras.main.setBackgroundColor('#09142c');this.makeVenue();this.input.on('pointerdown',p=>{if(!ball&&shots>0&&!won){aiming=true;startP={x:p.x,y:p.y}}});this.input.on('pointerup',p=>{if(!aiming)return;aiming=false;fire(p)});this.input.on('pointermove',p=>{if(aiming&&scene.aimLine){scene.aimLine.clear();scene.aimLine.lineStyle(4,0x20eaff,.85);scene.aimLine.lineBetween(scene.scale.width/2,scene.scale.height-122,p.x,p.y)}});this.aimLine=this.add.graphics().setDepth(7);reset()}makeVenue(){let w=this.scale.width,h=this.scale.height;let g=this.add.graphics();g.fillGradientStyle(0x182d59,0x291342,0x090d17,0x05070b,1);g.fillRect(0,0,w,h);g.lineStyle(1,0x20eaff,.18);for(let i=0;i<9;i++)g.lineBetween(w/2,h*.42,i*w/8,h);for(let y=h*.42;y<h;y+=70)g.lineBetween(0,y,w,y);g.lineStyle(7,0x59636e,1);g.lineBetween(20,h*.28,w-20,h*.28)}}
function reset(){if(!scene)return;targets.forEach(o=>o.destroy());targets=[];if(ball){ball.destroy();ball=null}won=false;shots=Math.max(5,7-Math.floor(((level-1)%50)/20));score=0;let w=scene.scale.width,h=scene.scale.height,rows=Math.min(5,2+Math.floor(((level-1)%50)/10)),size=Math.min(74,w/6.2);for(let r=0;r<rows;r++){let n=3+(r%2),gap=4,total=n*size+(n-1)*gap,x0=(w-total)/2;for(let c=0;c<n;c++){let key=(r+c)%2?'speaker':'flight',o=scene.matter.add.image(x0+c*(size+gap)+size/2,h*.43-r*(size*.72+4),key,null,{restitution:.16,friction:.65,density:.004});o.setDisplaySize(size,size*.72);o.setRectangle(size*.9,size*.66);o.setStatic(false);o.setIgnoreGravity(true);o.hit=false;targets.push(o)}}let can=scene.add.image(w/2,h-78,'cannon').setDisplaySize(145,165).setDepth(4);scene.cannon=can;ui()}
function fire(p){if(ball||shots<=0)return;let w=scene.scale.width,h=scene.scale.height,ox=w/2,oy=h-122,dx=p.x-ox,dy=p.y-oy;if(dy>-80)dy=-80;let n=Math.hypot(dx,dy);if(n<1)n=1;scene.aimLine?.clear();shots--;ball=scene.matter.add.circle(ox,oy,14,{restitution:.62,friction:.03,density:.03,label:'ball'});let vis=scene.add.circle(ox,oy,14,0x171b20).setStrokeStyle(4,0xbcc4cd).setDepth(6);ball.visual=vis;scene.matter.body.setVelocity(ball.body,{x:dx/n*22,y:dy/n*22});if(!scene._hitBound){scene.matter.world.on('collisionstart',hit);scene._hitBound=true}ui();let sync=()=>{if(!ball||!ball.body)return;vis.setPosition(ball.x,ball.y);if(ball.y>h+40||ball.y<-60){cleanup();checkEnd();return}scene.time.delayedCall(16,sync)};sync()}
function hit(ev){for(const pair of ev.pairs){let other=pair.bodyA.label==='ball'?pair.bodyB:pair.bodyB.label==='ball'?pair.bodyA:null;if(!other)continue;let obj=targets.find(o=>o.body===other);if(obj&&obj.active&&!obj.hit){obj.hit=true;obj.setIgnoreGravity(false);let vx=ball.body.velocity.x,vy=ball.body.velocity.y;scene.matter.body.setVelocity(obj.body,{x:vx*.65+(Math.random()-.5)*3,y:vy*.35-4});scene.matter.body.setAngularVelocity(obj.body,(Math.random()-.5)*.22);score+=125;scene.cameras.main.shake(130,.012);scene.tweens.add({targets:obj,alpha:.88,duration:80,yoyo:true});scene.time.delayedCall(1100,()=>{if(obj&&obj.active&&(obj.y>scene.scale.height*.72||Math.abs(obj.angle)>38)){obj.setActive(false).setVisible(false);ui();if(targets.every(t=>!t.active))victory()}});ui()}}}
function cleanup(){if(!ball)return;ball.visual?.destroy();ball.destroy();ball=null;}
function checkEnd(){if(targets.every(t=>!t.active))victory();else if(shots<=0)$('#fail').classList.remove('hidden')}
function victory(){if(won)return;won=true;cleanup();let done=level;coins+=40; cups+=3;level++;localStorage.setItem('soundtour-level',level);localStorage.setItem('soundtour-coins',coins);localStorage.setItem('soundtour-cups',cups);let step=((done-1)%50)+1,vis=Math.min(5,Math.ceil(step/10));document.querySelectorAll('.gear').forEach(e=>e.classList.toggle('on',+e.dataset.s<=vis));$('#reward').textContent='NOUVEL ÉQUIPEMENT INSTALLÉ · ÉTAPE '+step+'/50';$('#roomTxt').textContent=cities[Math.floor((done-1)/50)%cities.length]+' · '+step+'/50 AMÉLIORATIONS';$('#prog').style.width=(step*2)+'%';$('#room').classList.remove('hidden');ui()}
new Phaser.Game({type:Phaser.AUTO,parent:'phaser',width:480,height:820,transparent:true,scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},physics:{default:'matter',matter:{gravity:{y:1.35},debug:false}},scene:SoundTour});
$('#start').onclick=()=>{$('#intro').classList.add('hidden');reset()};$('#retry').onclick=()=>{$('#fail').classList.add('hidden');reset()};$('#next').onclick=()=>{$('#room').classList.add('hidden');reset()};$('#share').onclick=async()=>{let d={title:'Technorizon Sound Tour',text:'Viens jouer à Sound Tour !',url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);alert('Lien copié !')}}catch(e){}};ui();
</script></body></html>
