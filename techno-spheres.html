<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#030511"><title>Techno Spheres | Technorizon</title><style>*{box-sizing:border-box}html,body{margin:0;background:#030511;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100%}body{background:radial-gradient(circle at 20% 10%,#063c56 0,transparent 28%),radial-gradient(circle at 80% 15%,#431046 0,transparent 30%),#030511;display:flex;justify-content:center;align-items:flex-start}.app{width:min(540px,100%);margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px max(35px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.back,.pill,button{border:1px solid #27dff966;background:#071426;color:#fff;border-radius:14px;padding:10px 12px;font-weight:800}.back{font-size:18px}.title{text-align:center}.title b{font-size:22px;background:linear-gradient(90deg,#20e9ff,#fff,#ff45c7);color:transparent;background-clip:text}.title small{display:block;color:#8ba7bd}.world{margin-top:10px;padding:12px;border:1px solid #27dff944;border-radius:16px;background:#071426bb}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.bar{height:6px;background:#172238;border-radius:9px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#18e8ff,#ff45c7)}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.node{text-align:center;padding:7px 2px;border:1px solid #29415c;border-radius:10px;font-size:11px}.node.now{border:2px solid #21e7ff;box-shadow:0 0 12px #21e7ff55}.node.done{background:#0c4451}.mission{padding:10px 12px;border:1px solid #ff45c755;border-radius:14px;background:#170c24}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.stat{text-align:center;padding:7px 2px;border:1px solid #27364e;border-radius:10px;font-size:11px}.stat strong{font-size:16px}canvas{display:block;width:100%;aspect-ratio:420/590;border:1px solid #1c5265;border-radius:16px;background:#050815;touch-action:none}.boosts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.boost{padding:8px 2px;font-size:11px}.boost span{display:block;font-size:20px}.boost.active{outline:2px solid #23eaff}.status{text-align:center;color:#9eb2c5;font-size:12px;margin:8px}.win{display:none;position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 40px));padding:22px;text-align:center;border:1px solid #28e7ff88;border-radius:22px;background:#071426f5;box-shadow:0 0 50px #00ddff33}.win.show{display:block}.next{background:linear-gradient(90deg,#13dff3,#9d5cff);color:#00121a;border:0;margin-top:8px}.logo{width:38px;height:38px;object-fit:contain}/* Responsive game viewport: preserve the 420:590 coordinate system and pointer mapping. */

</style></head><body><div class="app"><div class="top"><button class="back" onclick="parent.postMessage('technorizon-close-game','*')">×</button><div class="title"><b>TECHNO SPHERES</b><small>WORLD TOUR • 500 NIVEAUX</small></div><img class="logo" src="/ImageLogoFinal.png"></div><div class="world"><div class="row"><strong id="place">🇫🇷 Paris • Niveau 1/500</strong><span>🪙 <b id="bank">120</b></span></div><div class="bar"><i id="bar" style="width:.2%"></i></div></div><div id="map" class="map"></div><div class="mission"><small>MISSION</small><div id="mission"></div></div><div class="stats"><div class="stat">TIRS<br><strong id="shots">22</strong></div><div class="stat">OBJECTIF<br><strong id="prog">0/8</strong></div><div class="stat">SÉRIE<br><strong id="streak">0🔥</strong></div><div class="stat">ÉTOILES<br><strong id="stars">☆☆☆</strong></div></div><canvas id="g"></canvas><div id="status" class="status">🎯 Vise puis relâche</div><div class="boosts"><button class="boost" data-p="laser"><span>🚀</span>Laser <b>x2</b></button><button class="boost" data-p="nova"><span>💣</span>Nova <b>x2</b></button><button class="boost" data-p="prism"><span>🌈</span>Prisme <b>x2</b></button><button class="boost" data-p="boost"><span>⚡</span>x2 <b>x2</b></button></div><div id="win" class="win"><div style="font-size:30px">🏆</div><strong id="wt">NIVEAU RÉUSSI !</strong><div id="wr"></div><button id="next" class="next">Niveau suivant →</button></div></div><script>(()=>{const cv=document.querySelector('#g'),c=cv.getContext('2d'),W=420,H=590,R=18,C=['#51ddff','#ff5bd8','#ffd85c','#81f79a','#ae8cff'];cv.width=W*2;cv.height=H*2;c.scale(2,2);const cities=[['🇫🇷','Paris'],['🇬🇧','London'],['🇩🇪','Berlin'],['🇪🇸','Ibiza'],['🇮🇹','Rome'],['🇳🇱','Amsterdam'],['🇺🇸','New York'],['🇧🇷','Rio'],['🇯🇵','Tokyo'],['🇦🇺','Sydney'],['🇨🇦','Toronto'],['🇲🇽','Mexico'],['🇸🇬','Singapore'],['🇰🇷','Seoul'],['🇦🇪','Dubai'],['🇿🇦','Cape Town'],['🇸🇪','Stockholm'],['🇬🇷','Athens'],['🇦🇷','Buenos Aires'],['🌍','World Final']];let level=+(localStorage.tsLevel||1),bank=+(localStorage.tsBank||120),streak=0,inv={laser:2,nova:2,prism:2,boost:2},balls=[],fall=[],shots=22,progress=0,ax=W/2,ay=150,shot=null,next=C[0],aim=false,state='play',power=null,mult=1,raf;const $=s=>document.querySelector(s),rnd=()=>C[Math.random()*C.length|0],L=()=>({x:W/2,y:H-36});function cfg(){let m=(level-1)%3;if(m===0)return{type:'drop',goal:8+Math.floor(level/30),txt:'⚡ Décroche les sphères'};if(m===1)return{type:'purple',goal:8+Math.floor(level/40),txt:'🟣 Élimine les sphères violettes'};return{type:'gem',goal:3+Math.floor(level/150),txt:'💎 Libère les cristaux Technorizon'}}function near(a,b){let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);return dx<=R*2.05&&dy<=R*1.82&&Math.hypot(dx,dy)<=R*2.08}function sn(){return progress>=cfg().goal?(shots>=10?3:shots>=5?2:1):0}function hud(){let ci=Math.min(19,Math.floor((level-1)/25)),m=cfg();$('#place').textContent=cities[ci][0]+' '+cities[ci][1]+' • Niveau '+level+'/500';$('#bank').textContent=bank;$('#bar').style.width=(level/500*100)+'%';$('#mission').textContent=m.txt+' • '+m.goal;$('#shots').textContent=shots;$('#prog').textContent=progress+'/'+m.goal;$('#streak').textContent=streak+'🔥';$('#stars').textContent='★'.repeat(sn())+'☆'.repeat(3-sn());let map=$('#map');map.innerHTML='';let inside=(level-1)%25+1,start=Math.max(1,inside-2);for(let i=start;i<Math.min(26,start+5);i++){let n=Math.floor((level-1)/25)*25+i,d=document.createElement('div');d.className='node '+(n<level?'done':n===level?'now':'');d.innerHTML=(i===25?'🏆':i%5===0?'🎁':n<level?'✓':'●')+'<br>'+n;map.appendChild(d)}document.querySelectorAll('.boost').forEach(b=>{let p=b.dataset.p;b.querySelector('b').textContent='x'+inv[p];b.classList.toggle('active',power===p);b.disabled=inv[p]<=0||state!=='play'})}function start(){cancelAnimationFrame(raf);balls=[];fall=[];shots=Math.max(16,23-Math.floor(level/60));progress=0;shot=null;next=rnd();state='play';power=null;mult=1;$('#win').classList.remove('show');let rows=Math.min(6+Math.floor(level/80),9);for(let row=0;row<rows;row++){let off=row%2?R:0;for(let k=0;k<10;k++){let x=R+off+k*R*2;if(x+R<W)balls.push({x,y:R+row*R*1.72,c:rnd(),type:'normal'})}}if(cfg().type==='gem'){[14,25,36,47,58,66].slice(0,cfg().goal).forEach(i=>{if(balls[i])balls[i].type='gem'})}hud();draw()}function ptr(e){let b=cv.getBoundingClientRect();ax=(e.clientX-b.left)*W/b.width;ay=Math.min((e.clientY-b.top)*H/b.height,H-90);draw()}function dir(){let l=L(),dx=ax-l.x,dy=ay-l.y;if(dy>-40)dy=-40;let m=Math.hypot(dx,dy)||1;return{x:dx/m,y:dy/m}}function fire(){if(state!=='play'||shot||fall.length||shots<=0)return;let l=L(),d=dir();shots--;shot={x:l.x,y:l.y,vx:d.x*14,vy:d.y*14,c:power==='prism'?C[4]:next};next=rnd();hud();loop()}function count(a){let m=cfg();if(m.type==='purple')progress+=a.filter(b=>b.c===C[4]).length;if(m.type==='gem')progress+=a.filter(b=>b.type==='gem').length;bank+=a.length*mult}function remove(a){a=[...new Set(a)];count(a);balls=balls.filter(b=>!a.includes(b))}function snap(){let bx=R,by=R,bd=1e9;for(let row=0;row<18;row++){let off=row%2?R:0;for(let k=0;k<11;k++){let x=R+off+k*R*2,y=R+row*R*1.72;if(x>W-R||balls.some(b=>Math.hypot(x-b.x,y-b.y)<R*1.5))continue;let d=Math.hypot(shot.x-x,shot.y-y);if(d<bd){bd=d;bx=x;by=y}}}let a={x:bx,y:by,c:shot.c,type:'normal'};balls.push(a);shot=null;if(power==='laser'){remove(balls.filter(b=>Math.abs(b.x-a.x)<R*1.2));use();drop();return}if(power==='nova'){remove(balls.filter(b=>Math.hypot(b.x-a.x,b.y-a.y)<R*4));use();drop();return}pop(a)}function use(){if(power){inv[power]=Math.max(0,inv[power]-1);power=null}}function pop(s){let g=[],seen=new Set(),q=[s];while(q.length){let a=q.pop();if(seen.has(a))continue;seen.add(a);g.push(a);balls.forEach(b=>{if(b.type==='normal'&&b.c===a.c&&!seen.has(b)&&near(a,b))q.push(b)})}if(g.length>=3){remove(g);use();drop()}else{use();turn()}}function drop(){let anchored=new Set(),q=[];balls.forEach(b=>{if(b.y<=R+2){anchored.add(b);q.push(b)}});while(q.length){let a=q.shift();balls.forEach(b=>{if(!anchored.has(b)&&near(a,b)){anchored.add(b);q.push(b)}})}let loose=balls.filter(b=>!anchored.has(b));balls=balls.filter(b=>anchored.has(b));if(cfg().type==='drop')progress+=loose.length;else count(loose);loose.forEach((b,i)=>fall.push({...b,vy:2+i*.05}));hud();if(fall.length){state='anim';fallLoop()}else finish()}function fallLoop(){function f(){fall.forEach(b=>{b.vy+=.3;b.y+=b.vy});fall=fall.filter(b=>b.y<H+50);draw();if(fall.length)raf=requestAnimationFrame(f);else finish()}f()}function finish(){if(progress>=cfg().goal)return win();state='play';turn()}function turn(){hud();if(shots<=0){state='lost';streak=0;$('#status').textContent='❌ Niveau échoué';$('#wt').textContent='NIVEAU ÉCHOUÉ';$('#wr').textContent='Tu peux recommencer immédiatement.';$('#next').textContent='↻ Rejouer le niveau';$('#win').classList.add('show');$('#win').scrollIntoView({block:'center',behavior:'smooth'});hud()}else{$('#status').textContent='🎯 Sphère prête';state='play'}draw()}function win(){state='won';$('#next').textContent='Niveau suivant →';let s=sn(),reward=35+level+s*10;bank+=reward;streak++;if(level%5===0){inv.nova++;inv.laser++}localStorage.tsBank=bank;localStorage.tsLevel=level;$('#wt').textContent=level%25===0?'🏆 VILLE TERMINÉE !':level%5===0?'🎁 COFFRE DÉBLOQUÉ !':'⭐ NIVEAU RÉUSSI !';$('#wr').textContent='★'.repeat(s)+'☆'.repeat(3-s)+' • 🪙 +'+reward;$('#win').classList.add('show');$('#status').textContent='🏆 Objectif atteint !';hud();draw();if(level<500){setTimeout(()=>{if(state==='won'){level++;localStorage.tsLevel=level;$('#wt').textContent='NIVEAU '+level;$('#wr').textContent='🚀 C’est parti ! • '+cities[Math.min(19,Math.floor((level-1)/25))][0]+' '+cities[Math.min(19,Math.floor((level-1)/25))][1];$('#next').style.display='none';setTimeout(()=>{if(state==='won'){start();$('#next').style.display='inline-block'}},1300)}},1800)}}function loop(){function f(){if(!shot)return;shot.x+=shot.vx;shot.y+=shot.vy;if(shot.x<R){shot.x=R;shot.vx=Math.abs(shot.vx)}if(shot.x>W-R){shot.x=W-R;shot.vx=-Math.abs(shot.vx)}if(shot.y<=R||balls.some(b=>Math.hypot(shot.x-b.x,shot.y-b.y)<=R*2-2)){snap();return}draw();raf=requestAnimationFrame(f)}f()}function sphere(x,y,col){let g=c.createRadialGradient(x-7,y-8,1,x,y,R);g.addColorStop(0,'#fff');g.addColorStop(.18,col);g.addColorStop(.75,col);g.addColorStop(1,'#09101c');c.fillStyle=g;c.beginPath();c.arc(x,y,R-1,0,7);c.fill()}function draw(){c.clearRect(0,0,W,H);let bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#050611');bg.addColorStop(1,'#08091a');c.fillStyle=bg;c.fillRect(0,0,W,H);c.save();c.globalAlpha=.13;c.strokeStyle='#5edcff';for(let y=300;y<H;y+=28){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}for(let x=-W;x<W*2;x+=38){c.beginPath();c.moveTo(W/2,250);c.lineTo(x,H);c.stroke()}c.restore();balls.forEach(b=>{sphere(b.x,b.y,b.c);if(b.type==='gem'){c.textAlign='center';c.font='15px sans-serif';c.fillStyle='#fff';c.fillText('💎',b.x,b.y+5)}});fall.forEach(b=>sphere(b.x,b.y,b.c));if(!shot&&state==='play'){let l=L(),d=dir(),x=l.x,y=l.y,vx=d.x,vy=d.y;c.save();c.setLineDash([5,6]);c.strokeStyle='#70eaff';c.beginPath();c.moveTo(x,y);for(let i=0;i<700;i++){x+=vx*2.5;y+=vy*2.5;if(x<R||x>W-R){vx=-vx;x=Math.max(R,Math.min(W-R,x))}if(y<=R||balls.some(b=>Math.hypot(x-b.x,y-b.y)<=R*2-2)){c.lineTo(x,y);break}if(i%8===0)c.lineTo(x,y)}c.stroke();c.restore()}let l=L();sphere(l.x,l.y,next);if(shot)sphere(shot.x,shot.y,shot.c)}cv.onpointerdown=e=>{if(state!=='play')return;aim=true;cv.setPointerCapture(e.pointerId);ptr(e)};cv.onpointermove=e=>{if(aim)ptr(e)};cv.onpointerup=e=>{if(!aim)return;ptr(e);aim=false;fire()};document.querySelectorAll('.boost').forEach(b=>b.onclick=()=>{if(state!=='play')return;let p=b.dataset.p;if(inv[p]<=0)return;if(p==='boost'){inv.boost--;mult=2;$('#status').textContent='⚡ Supercharge x2';hud();return}power=power===p?null:p;hud();draw()});$('#next').onclick=()=>{if(state==='lost'){start();return}if(state==='won'&&level<500){level++;localStorage.tsLevel=level;start()}};start()})();</script></body>
