<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><title>Écouter Technorizon en direct</title><link rel="icon" href="/ImageLogoFinal.png"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f9ff;background:radial-gradient(ellipse at 15% 10%,#27314e 0,transparent 48%),radial-gradient(ellipse at 90% 85%,#3b153c 0,transparent 48%),#080d19}.panel{width:min(100%,490px);padding:clamp(24px,6vw,46px);border:1px solid rgba(218,171,73,.55);border-radius:28px;text-align:center;background:linear-gradient(155deg,rgba(30,33,43,.96),rgba(10,14,24,.96));box-shadow:0 22px 80px #0009,0 0 38px #d3a24315}.logo{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 0 16px #00eaff55)}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#dcb05e;font-weight:800;margin:12px 0}h1{font-size:clamp(28px,7vw,38px);margin:8px 0;background:linear-gradient(90deg,#f8dc8e,#c9953e);color:transparent;background-clip:text}.subtitle{color:#c3cedb;font-size:15px;line-height:1.6;margin:12px 0 28px}.play{appearance:none;border:1px solid #e2b35e;border-radius:100px;background:linear-gradient(145deg,#e8c476,#b78234);color:#111722;font-weight:850;font-size:18px;min-height:64px;width:100%;cursor:pointer;box-shadow:0 10px 30px #c7923333}.play:focus-visible,.back:focus-visible{outline:3px solid #00eaff;outline-offset:4px}.status{min-height:22px;font-size:13px;color:#c3cedb;margin:16px 0 0}.back{display:inline-block;margin-top:28px;color:#8befff;text-decoration:none;font-weight:700;font-size:14px}.hint{font-size:12px;color:#96a3b5;margin-top:18px}audio{width:100%;margin-top:16px}
</style></head><body><main class="panel"><img class="logo" src="/ImageLogoFinal.png" alt="Logo Technorizon"><p class="eyebrow">La musique sans frontières</p><h1>Technorizon</h1><p class="subtitle">Techno · Eurodance · House<br>Les meilleurs sons, en direct, où que vous soyez.</p><button id="play" class="play" type="button" aria-label="Démarrer la radio">▶ Écouter en direct</button><p id="status" class="status" role="status">Prêt à diffuser</p><audio id="radio" preload="none" playsinline src="https://radio.technorizon.fr/listen/technorizon/radio.mp3"></audio><a class="back" href="/">← Retour sur Technorizon.fr</a><p class="hint">Le son démarre uniquement lorsque vous appuyez sur Écouter.</p></main><script>
const audio=document.getElementById('radio'),btn=document.getElementById('play'),status=document.getElementById('status');
btn.addEventListener('click',async()=>{if(!audio.paused){audio.pause();return}status.textContent='Connexion au direct…';try{await audio.play()}catch(e){status.textContent='Lecture impossible. Réessayez dans un instant.'}});
audio.addEventListener('playing',()=>{btn.textContent='Ⅱ Mettre en pause';btn.setAttribute('aria-label','Mettre la radio en pause');status.textContent='● Diffusion en direct'});
audio.addEventListener('pause',()=>{btn.textContent='▶ Écouter en direct';btn.setAttribute('aria-label','Démarrer la radio');status.textContent='Lecture en pause'});
audio.addEventListener('waiting',()=>{status.textContent='Chargement du direct…'});
audio.addEventListener('error',()=>{status.textContent='Flux temporairement indisponible'});
</script></body></html>
