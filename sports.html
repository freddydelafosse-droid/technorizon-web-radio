async function loadStandings(){footballContent.innerHTML='<div class="status">Chargement du classement…</div>';try{const r=await fetch('/api/sports?league='+currentLeague+'&view=standings&sport='+encodeURIComponent(sport.value),{cache:'no-store',signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error();const d=await r.json(),rows=Array.isArray(d.table)?d.table:[];if(!rows.length){let msg=d.message||'Classement momentanément indisponible.';if(sport.value==='basketball'){if(currentLeague==='provider-5380')msg='La Coupe de France se joue à élimination directe : il n’y a pas de classement général.';else if(currentLeague==='provider-4423')msg='Le classement Betclic ÉLITE 2026-2027 sera disponible après les premières rencontres du championnat.';else msg='Le classement sera affiché automatiquement dès que le fournisseur publiera les données de cette compétition.'}footballContent.innerHTML='<div class="status">'+esc(msg)+'</div>';return}footballContent.innerHTML='<div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th class="club">Club</th><th>J</th><th>G</th><th>N</th><th>P</th><th>Diff</th><th>Pts</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.rank+'</td><td class="club">'+(x.badge?'<img class="badge" src="'+esc(x.badge)+'" alt="">':'')+esc(x.team)+'</td><td>'+x.played+'</td><td>'+x.win+'</td><td>'+x.draw+'</td><td>'+x.loss+'</td><td>'+x.gd+'</td><td><b>'+x.points+'</b></td></tr>').join('')+'</tbody></table></div>'}catch(e){footballContent.innerHTML='<div class="status">Classement momentanément indisponible.</div>'}}async function loadLeagueEvents(view){footballContent.innerHTML='<div class="status">Chargement…</div>';results.style.display='none';try{const r=await fetch('/api/sports?league='+currentLeague+'&view='+view+'&sport='+encodeURIComponent(sport.value),{cache:'no-store',signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error();const d=await r.json(),items=Array.isArray(d.events)?d.events:[];if(!items.length){footballContent.innerHTML='<div class="status">Aucune rencontre disponible.</div>';return}footballContent.innerHTML='<div class="results">'+items.map(x=>'<article class="match"><div class="team">'+esc(x.home)+'</div><div class="score">'+esc(x.score)+'</div><div class="team">'+esc(x.away)+'</div><div class="meta '+(x.live?'live':'')+'">'+esc(x.competition)+(x.time?' • '+esc(x.time):'')+'</div></article>').join('')+'</div>'}catch(e){footballContent.innerHTML='<div class="status">Données momentanément indisponibles.</div>'}}
async function loadMotoGP(view){footballV2.classList.add('on');results.style.display='none';competition.closest('.field').style.display='none';footballContent.innerHTML='<div class="status">Chargement MotoGP…</div>';const apiView=view==='standings'?'drivers':view==='upcoming'?'calendar':'results';try{const r=await fetch('/api/sports?motorsport=motogp&view='+apiView,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),a=Array.isArray(d.items)?d.items:[];if(!a.length){footballContent.innerHTML='<div class="status">Données MotoGP momentanément indisponibles.</div>';return}if(apiView==='calendar'){footballContent.innerHTML='<div class="results">'+a.map(x=>'<article class="match"><div class="team">'+esc(x.name)+'</div><div class="score">🏍️</div><div class="team">'+esc(x.circuit)+'</div><div class="meta">'+esc(x.country)+(x.start?' • '+new Date(x.start).toLocaleDateString(lang.value):'')+'</div></article>').join('')+'</div>';return}if(apiView==='results'){const date=d.eventDate?' • '+new Date(d.eventDate).toLocaleDateString(lang.value):'';footballContent.innerHTML='<div class="status" style="padding:8px 0 18px"><b>'+esc(d.event||'Dernier Grand Prix')+'</b>'+esc(date)+'</div><div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th class="club">Pilote</th><th>Équipe</th><th>Écart / Temps</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.position)+'</td><td class="club"><b>'+esc(x.driver)+'</b></td><td>'+esc(x.team||x.constructor)+'</td><td><b>'+esc(x.gap||'')+'</b></td></tr>').join('')+'</tbody></table></div>';return}footballContent.innerHTML='<div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th class="club">Pilote</th><th>Équipe</th><th>Pts</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.position)+'</td><td class="club"><b>'+esc(x.driver)+'</b></td><td>'+esc(x.team||x.constructor)+'</td><td><b>'+esc(x.points??'')+'</b></td></tr>').join('')+'</tbody></table></div>'}catch(e){footballContent.innerHTML='<div class="statu
