<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020812"><title>Techno Blast · Technorizon</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#020812;touch-action:manipulation}body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(2,3,13,.22),rgba(2,3,13,.86)),url('/Fond-Technorizon-V2.png.png') center/cover no-repeat}.wrap{width:min(520px,calc(100% - 20px));margin:auto;padding:12px 0 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{color:#19efff;text-decoration:none;font-weight:900;font-size:14px}.logo{width:56px;height:56px;object-fit:contain}.brand{text-align:center;margin:2px 0 8px}.brand small{font-weight:950;letter-spacing:3px;color:#16e9f5}.brand h1{margin:2px 0;font-size:clamp(34px,10vw,54px);font-style:italic;line-height:.95;background:linear-gradient(90deg,#16e9f5,#fff,#ff2fbd);color:transparent;background-clip:text}.brand p{margin:7px 0;color:#c4d6e7;font-size:13px}.panel{border:1px solid #16e9f566;background:linear-gradient(145deg,rgba(5,24,44,.86),rgba(18,6,34,.9));border-radius:20px;padding:12px;box-shadow:0 0 28px #00efff18;backdrop-filter:blur(10px)}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.hud div{text-align:center;border:1px solid #ffffff1d;border-radius:13px;background:#ffffff0b;padding:7px 4px}.hud b{display:block;color:#fff;font-size:18px}.hud span{font-size:10px;color:#9eb7c9;text-transform:uppercase;font-weight:900;letter-spacing:.6px}.goal{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;margin-bottom:10px;border-radius:12px;background:#061326cc;border:1px solid #ff2fbd55;font-weight:850;font-size:13px}.goal strong{color:#ff73d3}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;aspect-ratio:1/1;background:#020817b8;border:1px solid #16e9f544;border-radius:17px;padding:7px;box-shadow:inset 0 0 25px #000}.tile{border:0;border-radius:9px;min-width:0;padding:0;position:relative;box-shadow:inset 0 -4px 0 #0003,0 2px 5px #0007;transition:transform .12s,opacity .12s;cursor:pointer}.tile:active{transform:scale(.9)}.c0{background:linear-gradient(145deg,#13f1ff,#087fae)}.c1{background:linear-gradient(145deg,#ff54cf,#a20d76)}.c2{background:linear-gradient(145deg,#8f6cff,#4b2ac7)}.c3{background:linear-gradient(145deg,#ffe75d,#d88705)}.c4{background:linear-gradient(145deg,#55ff9a,#079b62)}.tile.rocket:after,.tile.bomb:after,.tile.disco:after{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(16px,5vw,26px);filter:drop-shadow(0 2px 2px #000)}.tile.rocket:after{content:"🚀"}.tile.bomb:after{content:"💣"}.tile.disco:after{content:"🌈"}.pop{animation:pop .2s ease}.shake{animation:shake .25s ease}@keyframes pop{50%{transform:scale(1.28);filter:brightness(1.8)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.msg{height:29px;text-align:center;padding:7px;font-weight:950;font-size:13px;color:#19efff}.bar{height:7px;background:#ffffff14;border-radius:9px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16e9f5,#ff2fbd);transition:width .25s}.actions{display:flex;justify-content:center;gap:8px}.actions button{border:1px solid #16e9f566;border-radius:999px;background:#071a2d;color:#fff;padding:10px 15px;font-weight:900}.overlay{position:fixed;inset:0;z-index:20;background:#020812e8;display:none;place-items:center;padding:22px}.overlay.show{display:grid}.modal{width:min(390px,100%);text-align:center;border:1px solid #16e9f577;border-radius:25px;padding:26px;background:linear-gradient(145deg,#071a2d,#180a28);box-shadow:0 0 45px #16e9f533}.modal h2{font-size:32px;margin:4px 0 10px}.modal p{color:#bcd0df}.modal button{border:0;border-radius:999px;padding:14px 24px;background:linear-gradient(90deg,#16e9f5,#ff2fbd);font-weight:950;color:#02101a;font-size:15px}.hint{text-align:center;color:#839caf;font-size:11px;margin:10px 0 0}
</style></head><body><main class="wrap"><nav class="top"><a class="back" href="/techno-arcade.html">← Techno Arcade</a><img class="logo" src="/ImageLogoFinal.png" alt="Technorizon"></nav><header class="brand"><small>TECHNORIZON.FR</small><h1>TECHNO BLAST</h1><p>Explose les blocs · déclenche les boosters · réussis l'objectif</p></header><section class="panel"><div class="hud"><div><span>Niveau</span><b id="level">1</b></div><div><span>Coups</span><b id="moves">18</b></div><div><span>Score</span><b id="score">0</b></div></div><div class="goal"><span>🎯 Objectif : <strong id="goal">30 blocs</strong></span><span id="done">0/30</span></div><div class="bar"><i id="progress"></i></div><div class="board" id="board"></div><div class="msg" id="msg">Touche un groupe de 2 blocs ou plus</div><div class="actions"><button id="restart">↻ Recommencer</button></div><p class="hint">4+ blocs = 🚀 · 6+ = 💣 · 9+ = 🌈</p></section></main><div class="overlay" id="overlay"><div class="modal"><div id="resultIcon" style="font-size:50px">💥</div><h2 id="resultTitle">NIVEAU RÉUSSI !</h2><p id="resultText"></p><button id="next">NIVEAU SUIVANT →</button></div></div><script>
(()=>{const N=8,C=5,board=document.querySelector('#board'),movesEl=document.querySelector('#moves'),scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),goalEl=document.querySelector('#goal'),doneEl=document.querySelector('#done'),prog=document.querySelector('#progress'),msg=document.querySelector('#msg'),ov=document.querySelector('#overlay');let grid=[],level=1,moves=18,score=0,done=0,target=30,locked=false;
const rnd=()=>Math.floor(Math.random()*C);function setup(){moves=Math.max(13,19-level);target=26+level*4;done=0;grid=Array.from({length:N},()=>Array.from({length:N},()=>({c:rnd(),p:''})));ov.classList.remove('show');render();msg.textContent='Touche un groupe de 2 blocs ou plus'}
function render(){board.innerHTML='';levelEl.textContent=level;movesEl.textContent=moves;scoreEl.textContent=score;goalEl.textContent=target+' blocs';doneEl.textContent=Math.min(done,target)+'/'+target;prog.style.width=Math.min(100,done/target*100)+'%';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let x=grid[r][c],b=document.createElement('button');b.className='tile c'+x.c+(x.p?' '+x.p:'');b.dataset.r=r;b.dataset.c=c;b.onclick=()=>tap(r,c);board.appendChild(b)}}
function group(r,c){let col=grid[r][c].c,q=[[r,c]],seen=new Set([r+','+c]),out=[];while(q.length){let [y,x]=q.pop();out.push([y,x]);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dy,dx])=>{let a=y+dy,b=x+dx,k=a+','+b;if(a>=0&&a<N&&b>=0&&b<N&&!seen.has(k)&&grid[a][b].c===col){seen.add(k);q.push([a,b])}})}return out}
function special(r,c,p){let cells=[];if(p==='rocket'){for(let x=0;x<N;x++)cells.push([r,x]);for(let y=0;y<N;y++)cells.push([y,c])}else if(p==='bomb'){for(let y=Math.max(0,r-1);y<=Math.min(N-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(N-1,c+1);x++)cells.push([y,x])}else{let col=grid[r][c].c;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x].c===col)cells.push([y,x])}return cells}
function tap(r,c){if(locked)return;let cell=grid[r][c],g=cell.p?special(r,c,cell.p):group(r,c);if(!cell.p&&g.length<2){msg.textContent='Il faut au moins 2 blocs identiques';board.classList.add('shake');setTimeout(()=>board.classList.remove('shake'),250);return}moves--;let uniq=[...new Map(g.map(v=>[v.join(','),v])).values()],bonus='';if(!cell.p){if(g.length>=9)bonus='disco';else if(g.length>=6)bonus='bomb';else if(g.length>=4)bonus='rocket'}let kill=new Set(uniq.map(v=>v.join(',')));done+=kill.size;score+=kill.size*10+(kill.size>=4?kill.size*5:0);for(let c2=0;c2<N;c2++){let keep=[];for(let r2=N-1;r2>=0;r2--)if(!kill.has(r2+','+c2))keep.push(grid[r2][c2]);while(keep.length<N)keep.push({c:rnd(),p:''});for(let r2=N-1,i=0;r2>=0;r2--,i++)grid[r2][c2]=keep[i]}if(bonus){grid[Math.min(r,N-1)][c]={c:cell.c,p:bonus};msg.textContent=bonus==='rocket'?'🚀 ROCKET !':bonus==='bomb'?'💣 MEGA BASS !':'🌈 NEON BLAST !'}else msg.textContent=kill.size>=6?'🔥 SUPER COMBO !':'💥 +'+kill.size+' blocs';render();board.classList.add('pop');setTimeout(()=>board.classList.remove('pop'),200);check()}
function check(){if(done>=target){locked=true;setTimeout(()=>finish(true),300)}else if(moves<=0){locked=true;setTimeout(()=>finish(false),300)}}
function finish(ok){ov.classList.add('show');document.querySelector('#resultIcon').textContent=ok?'🏆':'😵';document.querySelector('#resultTitle').textContent=ok?'NIVEAU RÉUSSI !':'PLUS DE COUPS';document.querySelector('#resultText').textContent=ok?'Objectif atteint ! Score : '+score:'Tu as détruit '+done+' blocs sur '+target+'.';let n=document.querySelector('#next');n.textContent=ok?'NIVEAU SUIVANT →':'RÉESSAYER';n.onclick=()=>{if(ok)level++;locked=false;setup()}}
document.querySelector('#restart').onclick=()=>{locked=false;setup()};setup()})();
</script></body></html>
