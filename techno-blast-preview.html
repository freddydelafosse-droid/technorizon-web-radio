<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020812"><title>Techno Blast · Technorizon</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#061126;touch-action:manipulation}body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(#0a2048aa,#071126e8),url('/Fond-Technorizon-V2.png.png') center/cover no-repeat}.wrap{width:min(500px,calc(100% - 16px));margin:auto;padding:8px 0 28px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#34efff;text-decoration:none;font-weight:900;font-size:13px}.logo{width:48px;height:48px;object-fit:contain}.brand{text-align:center;margin:-2px 0 5px}.brand small{font-size:10px;font-weight:950;letter-spacing:2px;color:#38efff}.brand h1{margin:0;font-size:34px;font-style:italic;background:linear-gradient(90deg,#20eaff,#fff,#ff4bc9);color:transparent;background-clip:text}.brand p{display:none}.panel{background:linear-gradient(#193e73ee,#0b2149ee);border:2px solid #59dfff66;border-radius:22px;padding:10px;box-shadow:0 5px 25px #0009,inset 0 1px #fff3}.hud{display:flex;justify-content:center;gap:7px;margin-bottom:7px}.hud div{min-width:82px;text-align:center;border-radius:16px;background:linear-gradient(#315e9b,#173b71);border:2px solid #70cfff55;padding:5px;box-shadow:0 3px 6px #0005}.hud b{display:block;font-size:20px}.hud span{font-size:9px;text-transform:uppercase;font-weight:950;color:#d7edff}.goal{display:flex;justify-content:center;gap:15px;align-items:center;background:#102a55;border-radius:16px;padding:8px;margin-bottom:7px;font-size:13px;font-weight:900}.goal strong{color:#fff}.bar{display:none}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;aspect-ratio:1/1;background:#091833;border:4px solid #2b5790;border-radius:18px;padding:5px;box-shadow:inset 0 0 20px #000b,0 4px 8px #0007;overflow:hidden}.tile{border:0;border-radius:7px;min-width:0;padding:0;position:relative;box-shadow:inset 0 3px 2px #fff5,inset 0 -5px 3px #0003,0 2px 2px #0008;transition:transform .16s cubic-bezier(.2,1.5,.4,1),opacity .13s;cursor:pointer}.tile:before{content:"";position:absolute;left:15%;right:15%;top:9%;height:15%;border-radius:50%;background:#fff5}.tile:active{transform:scale(.86)}.c0{background:linear-gradient(#4eeaff,#00a9d7)}.c1{background:linear-gradient(#ff70c9,#d51f87)}.c2{background:linear-gradient(#b47cff,#7144df)}.c3{background:linear-gradient(#ffe969,#f2a510)}.c4{background:linear-gradient(#6dff9d,#19c86c)}.tile.crate{background:linear-gradient(135deg,#9d6432,#633816);border:3px solid #c88a4d}.tile.crate:after{content:"🎧";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(15px,5vw,25px)}.tile.rocket:after,.tile.bomb:after,.tile.disco:after{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(17px,5.4vw,28px);filter:drop-shadow(0 2px 1px #000)}.tile.rocket:after{content:"🚀"}.tile.bomb:after{content:"💣"}.tile.disco:after{content:"🌈"}.tile.ready{animation:ready 1s infinite alternate}.fall{animation:fall .22s ease-out}.blast{animation:blast .22s ease-out}.shake{animation:shake .22s}@keyframes ready{to{filter:brightness(1.25);transform:scale(.94)}}@keyframes fall{from{transform:translateY(-45px);opacity:.2}}@keyframes blast{50%{transform:scale(1.35);filter:brightness(2)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.msg{height:29px;text-align:center;padding:6px;font-weight:950;font-size:13px;color:#fff;text-shadow:0 2px 3px #000}.actions{text-align:center}.actions button{border:1px solid #61ddff88;border-radius:999px;background:#173b71;color:#fff;padding:8px 14px;font-weight:900}.hint{text-align:center;color:#a9c8e5;font-size:10px;margin:7px 0 0}.overlay{position:fixed;inset:0;z-index:20;background:#031029e8;display:none;place-items:center;padding:22px}.overlay.show{display:grid}.modal{width:min(380px,100%);text-align:center;border:2px solid #61ddff88;border-radius:25px;padding:25px;background:linear-gradient(#24518a,#102951);box-shadow:0 0 45px #19eaff44}.modal h2{font-size:30px;margin:4px}.modal p{color:#d7eaff}.modal button{border:0;border-radius:999px;padding:14px 24px;background:linear-gradient(90deg,#27eaff,#ff4bc9);font-weight:950;color:#031020}
</style></head><body><main class="wrap"><nav class="top"><a class="back" href="/techno-arcade.html">← Techno Arcade</a><img class="logo" src="/ImageLogoFinal.png" alt="Technorizon"></nav><header class="brand"><small>TECHNORIZON.FR</small><h1>TECHNO BLAST</h1><p>Explose les blocs · déclenche les boosters · réussis l'objectif</p></header><section class="panel"><div class="hud"><div><span>Niveau</span><b id="level">1</b></div><div><span>Coups</span><b id="moves">18</b></div><div><span>Score</span><b id="score">0</b></div></div><div class="goal"><span>🎯 Objectif : <strong id="goal">30 blocs</strong></span><span id="done">0/30</span></div><div class="bar"><i id="progress"></i></div><div class="board" id="board"></div><div class="msg" id="msg">Touche un groupe de 2 blocs ou plus</div><div class="actions"><button id="restart">↻ Recommencer</button></div><p class="hint">4+ blocs = 🚀 · 6+ = 💣 · 9+ = 🌈</p></section></main><div class="overlay" id="overlay"><div class="modal"><div id="resultIcon" style="font-size:50px">💥</div><h2 id="resultTitle">NIVEAU RÉUSSI !</h2><p id="resultText"></p><button id="next">NIVEAU SUIVANT →</button></div></div><script>
(()=>{const N=8,C=5,B=document.querySelector('#board'),M=document.querySelector('#moves'),S=document.querySelector('#score'),L=document.querySelector('#level'),G=document.querySelector('#goal'),D=document.querySelector('#done'),MSG=document.querySelector('#msg'),OV=document.querySelector('#overlay');let grid=[],level=1,moves=20,score=0,left=0,locked=false;
const color=()=>Math.floor(Math.random()*C), cube=()=>({c:color(),p:'',o:''});
function setup(){moves=Math.max(14,21-level);score=0;left=level<2?6:level<4?8:10;grid=Array.from({length:N},()=>Array.from({length:N},cube));placeObstacles();OV.classList.remove('show');locked=false;render(true);MSG.textContent='Élimine les casques 🎧'}
function placeObstacles(){let n=left,tries=0;while(n&&tries++<300){let r=2+Math.floor(Math.random()*(N-2)),c=Math.floor(Math.random()*N);if(!grid[r][c].o){grid[r][c]={c:-1,p:'',o:'crate'};n--}}}
function group(r,c){if(grid[r][c].o)return[];let col=grid[r][c].c,q=[[r,c]],seen=new Set([r+','+c]),out=[];while(q.length){let [y,x]=q.pop();out.push([y,x]);for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){let a=y+dy,b=x+dx,k=a+','+b;if(a>=0&&a<N&&b>=0&&b<N&&!seen.has(k)&&!grid[a][b].o&&grid[a][b].c===col){seen.add(k);q.push([a,b])}}}return out}
function render(fall=false){B.innerHTML='';L.textContent=level;M.textContent=moves;S.textContent=score;G.textContent='🎧 '+left+' casque'+(left>1?'s':'');D.textContent=left?'À libérer':'✓';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let x=grid[r][c],b=document.createElement('button');b.className='tile '+(x.o?'crate':'c'+x.c)+(x.p?' '+x.p:'')+(fall?' fall':'');if(!x.o&&!x.p&&group(r,c).length>=5)b.classList.add('ready');b.onclick=()=>tap(r,c);B.appendChild(b)}}
function powerCells(r,c,p){let a=[];if(p==='rocket'){for(let x=0;x<N;x++)a.push([r,x]);for(let y=0;y<N;y++)a.push([y,c])}else if(p==='bomb'){for(let y=Math.max(0,r-2);y<=Math.min(N-1,r+2);y++)for(let x=Math.max(0,c-2);x<=Math.min(N-1,c+2);x++)a.push([y,x])}else{let col=grid[r][c].c;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!grid[y][x].o&&grid[y][x].c===col)a.push([y,x])}return a}
function tap(r,c){if(locked)return;let cell=grid[r][c];if(cell.o){MSG.textContent='Explose des cubes à côté du casque';return}let cells=cell.p?powerCells(r,c,cell.p):group(r,c);if(!cell.p&&cells.length<2){MSG.textContent='Associe au moins 2 cubes';B.classList.add('shake');setTimeout(()=>B.classList.remove('shake'),220);return}locked=true;moves--;let bonus='';if(!cell.p){if(cells.length>=9)bonus='disco';else if(cells.length>=7)bonus='bomb';else if(cells.length>=5)bonus='rocket'}let kill=new Set(cells.map(v=>v.join(','))),adj=new Set();for(const [y,x] of cells)for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){let a=y+dy,b=x+dx;if(a>=0&&a<N&&b>=0&&b<N&&grid[a][b].o)adj.add(a+','+b)}for(const k of adj){kill.add(k);left--}score+=cells.length*20+adj.size*100;collapse(kill);if(bonus){let rr=Math.min(r,N-1),cc=Math.min(c,N-1);grid[rr][cc]={c:cell.c,p:bonus,o:''};MSG.textContent=bonus==='rocket'?'🚀 FUSÉE !':bonus==='bomb'?'💣 BOMBE !':'🌈 NEON BALL !'}else MSG.textContent=adj.size?'🎧 CASQUE LIBÉRÉ !':'💥 BLAST !';render(true);setTimeout(()=>{locked=false;check()},240)}
function collapse(kill){for(let c=0;c<N;c++){let a=[];for(let r=N-1;r>=0;r--)if(!kill.has(r+','+c))a.push(grid[r][c]);while(a.length<N)a.push(cube());for(let r=N-1,i=0;r>=0;r--,i++)grid[r][c]=a[i]}}
function check(){if(left<=0)return finish(true);if(moves<=0)return finish(false)}
function finish(ok){locked=true;OV.classList.add('show');document.querySelector('#resultIcon').textContent=ok?'⭐':'😵';document.querySelector('#resultTitle').textContent=ok?'NIVEAU RÉUSSI !':'PLUS DE COUPS';document.querySelector('#resultText').textContent=ok?'Tous les casques sont libérés !':'Il reste '+left+' casque'+(left>1?'s':'')+' à libérer.';let n=document.querySelector('#next');n.textContent=ok?'NIVEAU SUIVANT →':'RÉESSAYER';n.onclick=()=>{if(ok)level++;setup()}}
document.querySelector('#restart').onclick=setup;setup()})();
</script></body></html>
