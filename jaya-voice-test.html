<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Test voix Jaya</title><body style="background:#050713;color:white;font-family:Arial;text-align:center;padding:60px 20px"><h1>🎙️ Premier test vocal de Jaya</h1><p>Ce test reste hors antenne.</p><button id="go" style="font-size:18px;padding:14px 22px;cursor:pointer">▶ Écouter Jaya</button><p id="s"></p><audio id="a" controls style="margin-top:20px"></audio><script>go.onclick=async()=>{go.disabled=true;s.textContent="Jaya prépare son intervention…";try{const r=await fetch("/api/jaya-tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:"Bonjour, ici Jaya sur Technorizon."})});if(!r.ok)throw new Error(await r.text());a.src=URL.createObjectURL(await r.blob());await a.play();s.textContent="Test généré avec succès."}catch(e){s.textContent="Erreur : "+e.message}finally{go.disabled=false}}</script></body></html>
