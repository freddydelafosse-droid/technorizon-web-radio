name: Technorizon Artist and French Enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: technorizon-artist-enrichment
  cancel-in-progress: false

jobs:
  enrich-artists:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call protected artist and French enrichment API
        env:
          ARTIST_ENRICHMENT_SECRET: ${{ secrets.ARTIST_ENRICHMENT_SECRET }}
        run: |
         response=$(curl --location --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 180 \
            -H "x-enrichment-secret: ${ARTIST_ENRICHMENT_SECRET}" \
            "https://www.technorizon.fr/api/artist-enrichment")

          echo "$response"

          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); f=d.get("french_enrichment", {}); print("French enrichment:", f.get("state", "missing"), "added:", f.get("added", 0), "remaining:", f.get("remaining", "?")); sys.exit(0 if f.get("state") == "verified" else 1)'
