name: Jaya H24

on:
  schedule:
    - cron: '13,33,53 3-20 * * *'\n    - cron: '57 5,7,9 * * * *'\n    - cron: '27 10 * * * *' # 12h27 Paris en heure d'été (préparation du flash 12h30)
  workflow_dispatch:
    inputs:
      weather_now:
        description: 'Forcer Jaya météo maintenant'
        required: false
        default: false
        type: boolean
      news_now:
        description: 'Forcer Jaya infos maintenant'
        required: false
        default: false
        type: boolean

jobs:
  jaya:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher Jaya
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEATHER_NOW: ${{ inputs.weather_now }}
          NEWS_NOW: ${{ inputs.news_now }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PARIS_HOUR=$(TZ=Europe/Paris date +%H)
          PARIS_MINUTE=$(TZ=Europe/Paris date +%M)
          AUTO_WEATHER=false
          # Prépare le flash Infos + Météo environ 3 minutes avant les rendez-vous
          # 07h00, 09h00, 11h00 et 12h30 (heure de Paris).
          if [ "$EVENT_NAME" = "schedule" ] && [ "$PARIS_MINUTE" -ge 57 ]; then
            case "$PARIS_HOUR" in
              6|8|10|17) AUTO_WEATHER=true ;;
            esac
          fi

          AUTO_NEWS=false

          if [ "$NEWS_NOW" = "true" ] || [ "$AUTO_NEWS" = "true" ]; then
            echo "Déclenchement infos Jaya"
            curl --fail --silent --show-error \
              --retry 2 \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"action":"news-now"}' \
              "https://www.technorizon.fr/api/azuracast-test"
          elif [ "$WEATHER_NOW" = "true" ] || [ "$AUTO_WEATHER" = "true" ]; then
            echo "Déclenchement manuel météo Jaya"
            curl --fail --silent --show-error \
              --retry 2 \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"action":"weather-now"}' \
              "https://www.technorizon.fr/api/azuracast-test"
          else
            echo "Déclenchement automatique Jaya"
            curl --fail --silent --show-error \
              --retry 2 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.technorizon.fr/api/azuracast-test"
          fi
