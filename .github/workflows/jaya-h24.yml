name: Jaya H24

on:
  push:
    branches: [main]
    paths:
      - '.github/jaya-horoscope-kick'
      - '.github/jaya-horoscope-replay-kick'
      - '.github/jaya-flash-kick'
      - '.github/jaya-h24-kick'
  schedule:
    # Déclencheurs larges en UTC; les règles ci-dessous utilisent Europe/Paris.
    # Cela reste correct automatiquement lors des changements heure été/hiver.
    # Horloge H24 unique : le script rattache chaque tick au créneau éditorial attendu.
    - cron: '*/5 * * * *'
    # Déclenchement rapproché des rendez-vous Infos + Météo : priorité sans diffusion anticipée.
    - cron: '55 * * * *'
    - cron: '25 * * * *'
    # Technoroscope : génération rapprochée avant 07h15.
    - cron: '5 4,5,6,7 * * *'
    # Rediffusion proche de 08h15 : une file prioritaire passe dès le titre suivant.
  workflow_dispatch:
    inputs:
      weather_now:
        description: 'Forcer Jaya météo maintenant'
        required: false
        default: false
        type: boolean
      news_now:
        description: 'Forcer Jaya infos maintenant'
        required: false
        default: false
        type: boolean
      horoscope_now:
        description: 'Forcer le Technoroscope maintenant'
        required: false
        default: false
        type: boolean

jobs:
  jaya:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher Jaya
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEATHER_NOW: ${{ inputs.weather_now }}
          NEWS_NOW: ${{ inputs.news_now }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          HOROSCOPE_NOW: ${{ inputs.horoscope_now }}
          FLASH_KICK: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[JAYA_FLASH_KICK]') }}
          H24_KICK: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[JAYA_H24_KICK]') }}
          HOROSCOPE_KICK: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[JAYA_HOROSCOPE_KICK]') }}
          HOROSCOPE_REPLAY_KICK: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[JAYA_HOROSCOPE_REPLAY_KICK]') }}
        run: |
          PARIS_HOUR=$(TZ=Europe/Paris date +%H)
          PARIS_MINUTE=$(TZ=Europe/Paris date +%M)

          PARIS_DOW=$(TZ=Europe/Paris date +%u)
          AUTO_WEATHER=false
          AUTO_FLASH_REPLAY=""
          AUTO_HOROSCOPE=""
          ALLOW_H24=false

          if [ "$EVENT_NAME" = "schedule" ]; then
            # Identifier les rendez-vous éditoriaux par le cron d'origine : GitHub Actions
            # peut démarrer plusieurs minutes en retard.
            # Retrouver l'heure locale réellement visée par le cron, même si GitHub
            # démarre après le changement d'heure (ex. 10:55 lancé à 11:02).
            H=$((10#$PARIS_HOUR))
            ACTUAL_M=$((10#$PARIS_MINUTE))
            if [ "$EVENT_SCHEDULE" = "55 * * * *" ]; then
              # Utiliser directement l heure de Paris : H et ACTUAL_M sont initialises plus bas pour H24.
              SCHEDULED_H=$((10#$PARIS_HOUR))
              SCHEDULED_M=$((10#$PARIS_MINUTE))
              if [ "$SCHEDULED_M" -lt 55 ]; then SCHEDULED_H=$(( (SCHEDULED_H + 23) % 24 )); fi
              # Grille validée Infos + Météo : 07h00, 09h00, 11h00 et 12h30.
              # :55 lance les rendez-vous de 07h00, 09h00 et 11h00.
              case "$SCHEDULED_H" in
                6) AUTO_WEATHER=true ;;
                8) AUTO_FLASH_REPLAY="07" ;;
                10) AUTO_WEATHER=true ;;
              esac
            elif [ "$EVENT_SCHEDULE" = "25 * * * *" ]; then
              SCHEDULED_H=$H
              if [ "$ACTUAL_M" -lt 25 ]; then SCHEDULED_H=$(( (H + 23) % 24 )); fi
              # Déclenchement à 12h25 pour diffusion du dernier rendez-vous vers 12h30.
              if [ "$SCHEDULED_H" -eq 12 ]; then AUTO_FLASH_REPLAY="11"; fi
            fi

            # Technoroscope : le cron dédié reste le déclencheur principal.
            # Les passages H24 réguliers servent aussi de watchdog : si GitHub saute le cron
            # de :50, l'API rattrape le rendez-vous dans la fenêtre sûre. Les verrous
            # historique/file côté API empêchent toute double génération ou double diffusion.
            PARIS_DATE=$(TZ=Europe/Paris date +%F)
            if [ "$EVENT_SCHEDULE" = "5 4,5,6,7 * * *" ]; then
              TARGET_H=$((10#$PARIS_HOUR))
              TARGET_M=$((10#$PARIS_MINUTE))
              if [ "$TARGET_M" -lt 5 ]; then TARGET_H=$(( (TARGET_H + 23) % 24 )); fi
              if [ "$TARGET_H" -eq 7 ]; then AUTO_HOROSCOPE="generate"; fi
              if [ "$TARGET_H" -eq 8 ]; then AUTO_HOROSCOPE="replay"; fi
            elif [ "$EVENT_SCHEDULE" = "*/5 * * * *" ]; then
              WATCH_H=$((10#$PARIS_HOUR))
              WATCH_M=$((10#$PARIS_MINUTE))
              if [ "$WATCH_H" -eq 7 ] && [ "$WATCH_M" -ge 13 ] && [ "$WATCH_M" -le 28 ]; then
                AUTO_HOROSCOPE="generate"
              elif [ "$WATCH_H" -eq 8 ] && [ "$WATCH_M" -ge 25 ] && [ "$WATCH_M" -le 28 ]; then
                AUTO_HOROSCOPE="replay"
              fi
            fi

            # Horloge H24 unique : chaque tick de 5 minutes est rattaché au
            # prochain créneau logique :13/:33/:53. Aucune zone morte entre deux
            # créneaux ; les exclusions éditoriales ci-dessous restent prioritaires.
            H=$((10#$PARIS_HOUR))
            ACTUAL_M=$((10#$PARIS_MINUTE))
            if   [ "$ACTUAL_M" -lt 13 ]; then M=13
            elif [ "$ACTUAL_M" -lt 33 ]; then M=33
            elif [ "$ACTUAL_M" -lt 53 ]; then M=53
            else H=$(( (H + 1) % 24 )); M=13
            fi

            # :25 et :55 restent réservés aux rendez-vous éditoriaux.
            if [ "$EVENT_SCHEDULE" = "*/5 * * * *" ] && [ "$M" -ge 0 ] && [ "$AUTO_WEATHER" != "true" ]; then

              # Lundi-vendredi
              if [ "$PARIS_DOW" -ge 1 ] && [ "$PARIS_DOW" -le 5 ]; then
                if   [ "$H" -eq 5 ]  && [ "$M" -eq 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 6 ]  && [ "$H" -lt 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 13 ] && [ "$H" -lt 16 ] && { [ "$M" -eq 13 ] || [ "$M" -eq 33 ]; }; then ALLOW_H24=true
                elif [ "$H" -ge 16 ] && [ "$H" -lt 20 ]; then ALLOW_H24=true
                elif [ "$H" -ge 20 ] && [ "$H" -lt 22 ] && { [ "$M" -eq 13 ] || [ "$M" -eq 33 ]; }; then ALLOW_H24=true
                elif [ "$H" -eq 22 ] && [ "$M" -eq 13 ]; then ALLOW_H24=true
                fi
              # Samedi
              elif [ "$PARIS_DOW" -eq 6 ]; then
                # Samedi : démarrage Jaya dès 05h13, comme la plage matinale habituelle.
                if   [ "$H" -eq 5 ]  && [ "$M" -eq 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 6 ]  && [ "$H" -lt 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 13 ] && [ "$H" -lt 17 ] && [ "$M" -eq 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 17 ] && [ "$H" -lt 23 ]; then ALLOW_H24=true
                fi
              # Dimanche
              elif [ "$PARIS_DOW" -eq 7 ]; then
                if [ "$H" -ge 9 ] && [ "$H" -lt 21 ] && [ "$M" -eq 13 ]; then ALLOW_H24=true; fi
              fi
            fi

            # Garder une transition libre autour des flashs et du Technoroscope.
            # Ces créneaux H24 entraient en collision avec les MP3 prioritaires.
            if { [ "$H" -eq 7 ] || [ "$H" -eq 8 ]; } && { [ "$M" -eq 13 ] || [ "$M" -eq 33 ]; }; then ALLOW_H24=false; fi
            if { [ "$H" -eq 6 ] || [ "$H" -eq 8 ] || [ "$H" -eq 10 ] || [ "$H" -eq 12 ]; } && [ "$M" -eq 53 ]; then ALLOW_H24=false; fi

            # Filet de sécurité sur l'heure réelle : un tick */5 retardé après :53
            # bascule sinon vers le créneau :13 de l'heure suivante et contourne les
            # exclusions ci-dessus (ex. 08h54 interprété comme 09h13 avant le flash de 09h).
            if { [ "$PARIS_HOUR" -eq 6 ] || [ "$PARIS_HOUR" -eq 8 ] || [ "$PARIS_HOUR" -eq 10 ]; } && [ "$ACTUAL_M" -ge 45 ]; then ALLOW_H24=false; fi
            if { [ "$PARIS_HOUR" -eq 7 ] || [ "$PARIS_HOUR" -eq 8 ]; } && [ "$ACTUAL_M" -ge 5 ] && [ "$ACTUAL_M" -le 30 ]; then ALLOW_H24=false; fi
            if [ "$PARIS_HOUR" -eq 12 ] && [ "$ACTUAL_M" -ge 10 ] && [ "$ACTUAL_M" -le 35 ]; then ALLOW_H24=false; fi

            if [ "$AUTO_WEATHER" != "true" ] && [ -z "$AUTO_FLASH_REPLAY" ] && [ -z "$AUTO_HOROSCOPE" ] && [ "$ALLOW_H24" != "true" ]; then
              echo "Aucun passage Jaya prévu à cet horaire de Paris."
              exit 0
            fi
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$H24_KICK" = "true" ]; then
            echo "Déclenchement ponctuel Jaya H24"
            ACTION=""
          elif [ "$EVENT_NAME" = "push" ] && [ "$FLASH_KICK" = "true" ]; then
            echo "Déclenchement urgence Infos + Météo Jaya"
            ACTION="news-now"
          elif [ "$EVENT_NAME" = "push" ] && [ "$HOROSCOPE_REPLAY_KICK" = "true" ]; then
            echo "Déclenchement ponctuel de la rediffusion du Technoroscope"
            ACTION="horoscope-replay"
          elif [ "$EVENT_NAME" = "push" ] && [ "$HOROSCOPE_KICK" = "true" ]; then
            echo "Déclenchement ponctuel du Technoroscope Jaya"
            ACTION="horoscope-generate"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "Push sans kick Jaya reconnu : aucune injection."
            exit 0
          elif [ "$HOROSCOPE_NOW" = "true" ]; then
            echo "Génération immédiate du Technoroscope Jaya"
            ACTION="horoscope-generate"
          elif [ "$AUTO_HOROSCOPE" = "generate" ]; then
            echo "Génération unique du Technoroscope Jaya pour 07h15"
            ACTION="horoscope-generate"
          elif [ "$AUTO_HOROSCOPE" = "replay" ]; then
            echo "Réutilisation du Technoroscope Jaya pour 08h15"
            ACTION="horoscope-replay"
          elif [ "$NEWS_NOW" = "true" ]; then
            echo "Déclenchement infos Jaya"
            ACTION="news-now"
          elif [ -n "$AUTO_FLASH_REPLAY" ]; then
            echo "Réutilisation du flash Jaya de ${AUTO_FLASH_REPLAY}h"
            ACTION="flash-replay"
          elif [ "$WEATHER_NOW" = "true" ] || [ "$AUTO_WEATHER" = "true" ]; then
            echo "Déclenchement Infos + Météo Jaya"
            ACTION="weather-now"
          else
            echo "Déclenchement automatique Jaya"
            ACTION=""
          fi

          RESPONSE_FILE=$(mktemp)
          if [ -n "$ACTION" ]; then
            HTTP_CODE=$(curl --silent --show-error \
              -o "$RESPONSE_FILE" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data "$(if [ "$ACTION" = "flash-replay" ]; then printf '{\"action\":\"flash-replay\",\"period\":\"%s\"}' "$AUTO_FLASH_REPLAY"; else printf '{\"action\":\"%s\"}' "$ACTION"; fi)" \
              "https://www.technorizon.fr/api/azuracast-test") || CURL_EXIT=$?


          else
            HTTP_CODE=$(curl --silent --show-error \
              -o "$RESPONSE_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.technorizon.fr/api/azuracast-test") || CURL_EXIT=$?
          fi

          echo "Jaya API HTTP: ${HTTP_CODE:-000}"
          echo "Jaya API response:"
          cat "$RESPONSE_FILE"
          echo

          # Contrat API unique : un passage H24 prévu ne doit plus finir silencieusement
          # en BLOCKED. Les doublons légitimes restent acceptés via ALREADY_QUEUED/PLAYED.
          if [ -z "$ACTION" ] && grep -q '"state":"BLOCKED"' "$RESPONSE_FILE"; then
            echo "::error::Passage Jaya H24 bloqué par l'API."
            exit 1
          fi

          # Une génération éditoriale ne doit jamais être relancée automatiquement :
          # une erreur tardive peut survenir après le TTS ou l'upload et créer un doublon.
          # Les réponses HTTP 200 qui refusent silencieusement le créneau prioritaire
          # sont également transformées en échec visible.
          if [ -n "$ACTION" ] && grep -q '"reason":"outside-editorial-slot"' "$RESPONSE_FILE"; then
            echo "::error::Rubrique prioritaire refusée par la fenêtre éditoriale."
            exit 1
          fi

          # Un rendez-vous prioritaire n'est considéré réussi que si l'API confirme
          # soit sa présence réelle dans la file, soit qu'il a déjà été diffusé/placé.
          # Un simple HTTP 200 ne suffit plus.
          if [ "$ACTION" = "horoscope-generate" ]; then
            if ! grep -Eq '"queue_verified":true|"reason":"horoscope-first-slot-already-broadcast"|"reason":"horoscope-already-generated-or-queued"' "$RESPONSE_FILE"; then
              echo "::error::Technoroscope non confirmé dans la file/historique."
              exit 1
            fi
          elif [ "$ACTION" = "horoscope-replay" ]; then
            if ! grep -Eq '"action":"horoscope-replay"|"reason":"horoscope-second-slot-already-broadcast"|"reason":"horoscope-already-queued"' "$RESPONSE_FILE"; then
              echo "::error::Rediffusion Technoroscope non confirmée."
              exit 1
            fi
          fi

          if [ -n "${CURL_EXIT:-}" ] || [ "${HTTP_CODE:-000}" -ge 400 ]; then
            echo "::error::Jaya API en échec - HTTP ${HTTP_CODE:-000}, curl exit ${CURL_EXIT:-0}."
            exit 1
          fi

# Emergency flash kick
