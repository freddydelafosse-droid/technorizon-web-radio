name: Jaya H24

on:
  schedule:
    # GitHub cron est en UTC. En heure d'été française (UTC+2):
    # H24: 05h13/33/53 à 22h13/33/53.
    - cron: '13,33,53 3-20 * * *'
    # Préparation Infos + Météo: 06h57, 08h57, 10h57 et 12h27 heure de Paris.
    - cron: '57 4,6,8 * * *'
    - cron: '27 10 * * *'
  workflow_dispatch:
    inputs:
      weather_now:
        description: 'Forcer Jaya météo maintenant'
        required: false
        default: false
        type: boolean
      news_now:
        description: 'Forcer Jaya infos maintenant'
        required: false
        default: false
        type: boolean

jobs:
  jaya:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher Jaya
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEATHER_NOW: ${{ inputs.weather_now }}
          NEWS_NOW: ${{ inputs.news_now }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PARIS_HOUR=$(TZ=Europe/Paris date +%H)
          PARIS_MINUTE=$(TZ=Europe/Paris date +%M)

          AUTO_WEATHER=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$PARIS_HOUR:$PARIS_MINUTE" in
              6:57|8:57|10:57|12:27) AUTO_WEATHER=true ;;
            esac
          fi

          if [ "$NEWS_NOW" = "true" ]; then
            echo "Déclenchement infos Jaya"
            ACTION="news-now"
          elif [ "$WEATHER_NOW" = "true" ] || [ "$AUTO_WEATHER" = "true" ]; then
            echo "Déclenchement Infos + Météo Jaya"
            ACTION="weather-now"
          else
            echo "Déclenchement automatique Jaya"
            ACTION=""
          fi

          if [ -n "$ACTION" ]; then
            curl --fail --silent --show-error --retry 2 \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"action\":\"$ACTION\"}" \
              "https://www.technorizon.fr/api/azuracast-test"
          else
            curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.technorizon.fr/api/azuracast-test"
          fi
