name: Jaya H24

on:
  schedule:
    - cron: '3,13,27,33,43,53,57 * * * *'
  workflow_dispatch:
    inputs:
      weather_now:
        description: 'Forcer Jaya météo maintenant'
        required: false
        default: false
        type: boolean
      news_now:
        description: 'Forcer Jaya infos maintenant'
        required: false
        default: false
        type: boolean

jobs:
  jaya:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher Jaya
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEATHER_NOW: ${{ inputs.weather_now }}
          NEWS_NOW: ${{ inputs.news_now }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PARIS_HOUR=$(TZ=Europe/Paris date +%H)
          PARIS_MINUTE=$(TZ=Europe/Paris date +%M)
          AUTO_WEATHER=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$PARIS_HOUR" -ge 4 ] && [ "$PARIS_HOUR" -le 19 ] && [ "$PARIS_MINUTE" -ge 57 ]; then
            AUTO_WEATHER=true
          fi

          AUTO_NEWS=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$PARIS_HOUR" -ge 4 ] && [ "$PARIS_HOUR" -le 19 ] && [ "$PARIS_MINUTE" -ge 57 ]; then
            AUTO_NEWS=true
          fi

          if [ "$NEWS_NOW" = "true" ] || [ "$AUTO_NEWS" = "true" ]; then
            echo "Déclenchement infos Jaya"
            curl --fail --silent --show-error \
              --retry 2 \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"action":"news-now"}' \
              "https://www.technorizon.fr/api/azuracast-test"
          elif [ "$WEATHER_NOW" = "true" ] || [ "$AUTO_WEATHER" = "true" ]; then
            echo "Déclenchement manuel météo Jaya"
            curl --fail --silent --show-error \
              --retry 2 \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"action":"weather-now"}' \
              "https://www.technorizon.fr/api/azuracast-test"
          else
            echo "Déclenchement automatique Jaya"
            curl --fail --silent --show-error \
              --retry 2 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.technorizon.fr/api/azuracast-test"
          fi
