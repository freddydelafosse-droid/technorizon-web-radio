name: Jaya H24

on:
  schedule:
    # Déclencheurs larges en UTC; les règles ci-dessous utilisent Europe/Paris.
    # Cela reste correct automatiquement lors des changements heure été/hiver.
    - cron: '13,33,53 * * * *'
    # Préparation des rendez-vous Infos + Météo.
    - cron: '57 * * * *'
    - cron: '27 * * * *'
  workflow_dispatch:
    inputs:
      weather_now:
        description: 'Forcer Jaya météo maintenant'
        required: false
        default: false
        type: boolean
      news_now:
        description: 'Forcer Jaya infos maintenant'
        required: false
        default: false
        type: boolean

jobs:
  jaya:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher Jaya
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEATHER_NOW: ${{ inputs.weather_now }}
          NEWS_NOW: ${{ inputs.news_now }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PARIS_HOUR=$(TZ=Europe/Paris date +%H)
          PARIS_MINUTE=$(TZ=Europe/Paris date +%M)

          PARIS_DOW=$(TZ=Europe/Paris date +%u)
          AUTO_WEATHER=false
          ALLOW_H24=false

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$PARIS_HOUR:$PARIS_MINUTE" in
              6:57|8:57|10:57|12:27) AUTO_WEATHER=true ;;
            esac

            # Les déclencheurs :57/:27 sont réservés aux rendez-vous éditoriaux.
            if [ "$PARIS_MINUTE" = "13" ] || [ "$PARIS_MINUTE" = "33" ] || [ "$PARIS_MINUTE" = "53" ]; then
              H=$((10#$PARIS_HOUR))
              M=$((10#$PARIS_MINUTE))

              # Lundi-vendredi
              if [ "$PARIS_DOW" -ge 1 ] && [ "$PARIS_DOW" -le 5 ]; then
                if   [ "$H" -eq 5 ]  && [ "$M" -eq 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 6 ]  && [ "$H" -lt 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 13 ] && [ "$H" -lt 16 ] && { [ "$M" -eq 13 ] || [ "$M" -eq 33 ]; }; then ALLOW_H24=true
                elif [ "$H" -ge 16 ] && [ "$H" -lt 20 ]; then ALLOW_H24=true
                elif [ "$H" -ge 20 ] && [ "$H" -lt 22 ] && { [ "$M" -eq 13 ] || [ "$M" -eq 33 ]; }; then ALLOW_H24=true
                elif [ "$H" -eq 22 ] && [ "$M" -eq 13 ]; then ALLOW_H24=true
                fi
              # Samedi
              elif [ "$PARIS_DOW" -eq 6 ]; then
                if   [ "$H" -eq 8 ]  && [ "$M" -eq 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 9 ]  && [ "$H" -lt 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 13 ] && [ "$H" -lt 17 ] && [ "$M" -eq 13 ]; then ALLOW_H24=true
                elif [ "$H" -ge 17 ] && [ "$H" -lt 23 ]; then ALLOW_H24=true
                fi
              # Dimanche
              elif [ "$PARIS_DOW" -eq 7 ]; then
                if [ "$H" -ge 9 ] && [ "$H" -lt 21 ] && [ "$M" -eq 13 ]; then ALLOW_H24=true; fi
              fi
            fi

            if [ "$AUTO_WEATHER" != "true" ] && [ "$ALLOW_H24" != "true" ]; then
              echo "Aucun passage Jaya prévu à cet horaire de Paris."
              exit 0
            fi
          fi

          if [ "$NEWS_NOW" = "true" ]; then
            echo "Déclenchement infos Jaya"
            ACTION="news-now"
          elif [ "$WEATHER_NOW" = "true" ] || [ "$AUTO_WEATHER" = "true" ]; then
            echo "Déclenchement Infos + Météo Jaya"
            ACTION="weather-now"
          else
            echo "Déclenchement automatique Jaya"
            ACTION=""
          fi

          RESPONSE_FILE=$(mktemp)
          if [ -n "$ACTION" ]; then
            HTTP_CODE=$(curl --silent --show-error --retry 2 \
              -o "$RESPONSE_FILE" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"action\":\"$ACTION\"}" \
              "https://www.technorizon.fr/api/azuracast-test") || CURL_EXIT=$?
          else
            HTTP_CODE=$(curl --silent --show-error --retry 2 \
              -o "$RESPONSE_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.technorizon.fr/api/azuracast-test") || CURL_EXIT=$?
          fi

          echo "Jaya API HTTP: ${HTTP_CODE:-000}"
          echo "Jaya API response:"
          cat "$RESPONSE_FILE"
          echo

          if [ -n "${CURL_EXIT:-}" ] || [ "${HTTP_CODE:-000}" -ge 400 ]; then
            echo "::error::Jaya API failed - HTTP ${HTTP_CODE:-000}, curl exit ${CURL_EXIT:-0}"
            exit 1
          fi
