name: Build Game Zone share image
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to JPG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          rsvg-convert -w 1200 -h 630 game-zone-share.svg -o /tmp/game-zone-share.png
          convert /tmp/game-zone-share.png -background "#020812" -alpha remove -strip -quality 82 game-zone-share.jpg
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-zone-share.jpg
          git diff --cached --quiet || git commit -m "Add WhatsApp-compatible Game Zone share image"
          git push
