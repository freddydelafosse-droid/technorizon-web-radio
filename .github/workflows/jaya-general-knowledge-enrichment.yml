name: Jaya General Knowledge Enrichment

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enrichir les connaissances generalistes de Jaya
        env:
          ENRICHMENT_SECRET: ${{ secrets.ARTIST_ENRICHMENT_SECRET }}
        run: |
          if [ -z "$ENRICHMENT_SECRET" ]; then
            echo "::error::Secret d'enrichissement manquant"
            exit 1
          fi
          slot=$(( ($(date -u +%s) / 900) % 34 ))
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 240 \
            -H "x-enrichment-secret: $ENRICHMENT_SECRET" \
            "https://www.technorizon.fr/api/artist-enrichment?mode=general&offset=$slot&topics=4"
