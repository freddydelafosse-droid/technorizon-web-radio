<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020812"><title>Neon Blocks | Technorizon</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:#020812;color:#fff}body{background:radial-gradient(circle at 50% -10%,#123a66,transparent 38%),linear-gradient(#030816,#071126 70%,#020812);overflow-x:hidden}.wrap{width:min(620px,calc(100% - 22px));margin:auto;padding:14px 0 36px}.top{display:flex;align-items:center;justify-content:space-between}.logo{width:56px}.pill{padding:9px 13px;border:1px solid #27e9ff55;border-radius:999px;background:#06162a;font-weight:900;font-size:13px}.hero{text-align:center;margin:12px 0}.hero h1{margin:4px;font-size:clamp(30px,8vw,48px);font-style:italic;background:linear-gradient(90deg,#28ecff,#fff,#ff35bf);color:transparent;background-clip:text}.hero p{margin:4px;color:#9fb3c8}.hud{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;margin:12px 0}.hud div{text-align:center;padding:10px 5px;border:1px solid #ffffff18;border-radius:14px;background:#07162bcc}.hud small{display:block;color:#8197ac;font-weight:800;font-size:10px}.hud strong{font-size:19px}.mission{padding:13px;border-radius:16px;background:#071a31;border:1px solid #27e9ff44;text-align:center;font-weight:900}.mission b{color:#2beaff}.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;aspect-ratio:1;margin:12px 0;padding:7px;border-radius:20px;background:#020916;border:1px solid #ffffff20;box-shadow:0 12px 45px #0009}.brick{position:relative;border:0;border-radius:8px;box-shadow:inset 0 -5px 0 #0003,0 2px 7px #0008;transition:.15s;min-width:0}.brick:active{transform:scale(.9)}.c0{background:linear-gradient(#28e7ff,#087cbd)}.c1{background:linear-gradient(#ff4fc8,#b21685)}.c2{background:linear-gradient(#ffe25b,#d99008)}.c3{background:linear-gradient(#7aff72,#199d49)}.c4{background:linear-gradient(#aa7bff,#6135cf)}.empty{background:#07111e;box-shadow:inset 0 0 0 1px #ffffff08}.locked{background:#273141;box-shadow:inset 0 0 0 2px #617083}.locked:after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:16px}.hit{animation:pop .28s ease-out forwards}@keyframes pop{50%{transform:scale(1.25);filter:brightness(2.5)}100%{transform:scale(.05);opacity:0}}.msg{min-height:46px;padding:11px 14px;border-radius:14px;background:#ffffff09;text-align:center;color:#c8d5e2;font-weight:750}.help{margin-top:12px;padding:14px;border-radius:16px;background:#061326;border:1px solid #ffffff12}.help strong{display:block;margin-bottom:6px;color:#fff}.help span{color:#91a6ba;font-size:13px;line-height:1.45}.gate,.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:#020812ee;backdrop-filter:blur(10px)}.card{width:min(430px,100%);padding:25px;border-radius:24px;background:#07172c;border:1px solid #28eaff55;text-align:center;box-shadow:0 25px 80px #000}.card input{width:100%;margin:14px 0;padding:15px;border-radius:12px;border:1px solid #ffffff25;background:#020a16;color:#fff;font-size:17px;text-align:center}.btn{width:100%;padding:15px;border:0;border-radius:999px;background:linear-gradient(90deg,#1ce7fa,#8c78ff,#ff36be);color:#fff;font-weight:1000;font-size:16px}.hidden{display:none}.stars{font-size:28px;letter-spacing:5px}.fx{position:absolute;inset:0;pointer-events:none}.wave{position:absolute;border:3px solid #fff;border-radius:50%;width:30px;height:30px;animation:wave .55s ease-out forwards}@keyframes wave{to{transform:scale(9);opacity:0}}@media(max-width:480px){.wrap{width:calc(100% - 12px)}.board{gap:4px;padding:5px}.locked:after{font-size:12px}}
</style></head><body><main class="wrap"><div class="top"><span class="pill" id="player">JOUEUR</span><img class="logo" src="/ImageLogoFinal.png" alt="Technorizon"></div><header class="hero"><h1>NEON BLOCKS</h1><p>Un objectif. Une règle. Des niveaux de plus en plus tactiques.</p></header><section class="hud"><div><small>NIVEAU</small><strong id="level">1</strong></div><div><small>OBJECTIF</small><strong id="goal">0 / 0</strong></div><div><small>COUPS</small><strong id="moves">0</strong></div></section><div class="mission" id="mission"></div><section class="board" id="board"></section><div class="msg" id="msg">Touche un groupe de 2 briques ou plus de la même couleur.</div><div class="help"><strong>RÈGLE DU NIVEAU</strong><span id="rule"></span></div></main>
<div class="gate" id="gate"><div class="card"><img class="logo" src="/ImageLogoFinal.png"><h2>NEON BLOCKS</h2><p>Entre ton pseudo pour commencer.</p><input id="name" maxlength="16" placeholder="Ton pseudo"><button class="btn" id="start">JOUER</button></div></div>
<div class="modal hidden" id="modal"><div class="card"><div class="stars" id="stars">★★★</div><h2 id="result">NIVEAU RÉUSSI !</h2><p id="summary"></p><button class="btn" id="next">NIVEAU SUIVANT</button></div></div>
<script>
const N=8,C=5,B=document.querySelector('#board'),L=document.querySelector('#level'),M=document.querySelector('#moves'),G=document.querySelector('#goal'),MISSION=document.querySelector('#mission'),RULE=document.querySelector('#rule'),MSG=document.querySelector('#msg'),MOD=document.querySelector('#modal');
let level=1,moves=0,target=0,done=0,grid=[],locked=false,name='';
const saved=JSON.parse(localStorage.getItem('technorizon-neon-blocks')||'{}');if(saved.level)level=saved.level;if(saved.name)document.querySelector('#name').value=saved.name;
function spec(){let stage=(level-1)%6;return[
{target:18,moves:14,locked:0,text:'Élimine 18 briques',rule:'Touche un groupe de 2 briques ou plus de la même couleur. Toutes les briques supprimées comptent.'},
{target:28,moves:16,locked:0,text:'Élimine 28 briques',rule:'Cherche les groupes les plus grands : un seul coup peut éliminer beaucoup de briques.'},
{target:36,moves:17,locked:0,text:'Élimine 36 briques',rule:'Les briques tombent après chaque coup. Anticipe les regroupements pour économiser tes coups.'},
{target:30,moves:18,locked:5,text:'Élimine 30 briques et casse 5 verrous',rule:'Un verrou se casse uniquement quand tu élimines un groupe directement à côté de lui.'},
{target:42,moves:19,locked:7,text:'Élimine 42 briques et casse 7 verrous',rule:'Les verrous bloquent la chute. Libère-les tôt pour ouvrir le plateau.'},
{target:52,moves:20,locked:9,text:'Élimine 52 briques et casse 9 verrous',rule:'Niveau tactique : crée de grands groupes tout en ouvrant les zones verrouillées.'}
][stage]}
let locks=0,locksDone=0;
function cube(){return{c:Math.floor(Math.random()*C),lock:false}}
function setup(){let s=spec();target=s.target;moves=s.moves;done=0;locks=s.locked;locksDone=0;grid=Array.from({length:N},()=>Array.from({length:N},cube));let q=0;while(q<locks){let r=2+Math.floor(Math.random()*5),c=Math.floor(Math.random()*N);if(!grid[r][c].lock){grid[r][c].lock=true;q++}}L.textContent=level;MISSION.innerHTML='<b>MISSION :</b> '+s.text+(locks?'':'');RULE.textContent=s.rule;render()}
function group(r,c){let z=grid[r][c];if(!z||z.lock)return[];let col=z.c,out=[],seen=new Set(),q=[[r,c]];while(q.length){let [y,x]=q.pop(),k=y+','+x;if(seen.has(k)||y<0||y>=N||x<0||x>=N)continue;let a=grid[y][x];if(!a||a.lock||a.c!==col)continue;seen.add(k);out.push([y,x]);q.push([y+1,x],[y-1,x],[y,x+1],[y,x-1])}return out}
function collapse(kill){for(let x=0;x<N;x++){let col=[];for(let y=N-1;y>=0;y--){let k=y+','+x;if(!kill.has(k))col.push(grid[y][x])}while(col.length<N)col.push(cube());for(let y=N-1,i=0;y>=0;y--,i++)grid[y][x]=col[i]}}
function render(){B.innerHTML='';grid.forEach((row,r)=>row.forEach((z,c)=>{let b=document.createElement('button');b.className='brick '+(z.lock?'locked':'c'+z.c);b.onclick=()=>tap(r,c);B.appendChild(b)}));let s=spec();G.textContent=done+' / '+target+(locks?' · 🔒 '+locksDone+'/'+locks:'');M.textContent=moves}
function tap(r,c){if(locked||moves<=0)return;if(grid[r][c].lock){MSG.textContent='🔒 Ce verrou se casse en supprimant un groupe juste à côté.';return}let cells=group(r,c);if(cells.length<2){MSG.textContent='Il faut au moins 2 briques identiques connectées.';return}moves--;let kill=new Set(cells.map(v=>v.join(','))),adj=new Set();for(let [y,x] of cells)for(let [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){let yy=y+dy,xx=x+dx;if(yy>=0&&yy<N&&xx>=0&&xx<N&&grid[yy][xx].lock)adj.add(yy+','+xx)}adj.forEach(k=>{kill.add(k);locksDone++});done+=cells.length;locked=true;[...B.children].forEach((b,i)=>{let y=Math.floor(i/N),x=i%N;if(kill.has(y+','+x))b.classList.add('hit')});setTimeout(()=>{collapse(kill);locked=false;render();if(done>=target&&locksDone>=locks)win();else if(moves<=0)lose();else MSG.textContent=cells.length>=7?'🔥 Excellent ! Gros groupe éliminé.':adj.size?'🔓 Verrou cassé ! Continue.':'Bien joué. Prépare le prochain groupe.'},280)}
function win(){locked=true;let left=moves,stars=left>=7?3:left>=3?2:1;document.querySelector('#stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);document.querySelector('#result').textContent='NIVEAU '+level+' RÉUSSI !';document.querySelector('#summary').textContent=done+' briques éliminées · '+left+' coups restants';document.querySelector('#next').textContent='NIVEAU SUIVANT';MOD.classList.remove('hidden')}
function lose(){locked=true;document.querySelector('#stars').textContent='☆☆☆';document.querySelector('#result').textContent='PRESQUE !';document.querySelector('#summary').textContent='Objectif : '+target+' briques'+(locks?' et '+locks+' verrous':'')+'.';document.querySelector('#next').textContent='REJOUER';MOD.classList.remove('hidden')}
document.querySelector('#next').onclick=()=>{if(done>=target&&locksDone>=locks){level++;localStorage.setItem('technorizon-neon-blocks',JSON.stringify({name,level}))}MOD.classList.add('hidden');locked=false;setup()};
document.querySelector('#start').onclick=()=>{name=document.querySelector('#name').value.trim();if(!name){document.querySelector('#name').focus();return}document.querySelector('#player').textContent='👤 '+name;document.querySelector('#gate').classList.add('hidden');localStorage.setItem('technorizon-neon-blocks',JSON.stringify({name,level}));setup()};
setup();
</script></body></html>
