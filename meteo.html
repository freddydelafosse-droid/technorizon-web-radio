<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Météo | Technorizon.fr</title><link rel="icon" type="image/jpeg" href="Logo-Officiel-Technorizon.jpg"><link rel="stylesheet" href="style-v2.css?v=4"><style>
.detail-page{min-height:100vh;padding:40px 20px;position:relative;isolation:isolate}.detail-main{width:min(1000px,100%);margin:auto}.detail-back{display:inline-block;margin-bottom:25px;color:#dce8f5;text-decoration:none}.detail-panel{padding:38px;border:1px solid rgba(0,234,255,.35);border-radius:24px;background:linear-gradient(135deg,rgba(0,20,35,.84),rgba(20,5,40,.82));backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(0,234,255,.08),0 0 50px rgba(255,0,200,.06)}.detail-title{text-align:center;color:#fff;letter-spacing:6px;font-size:clamp(30px,5vw,48px);margin:0 0 8px}.detail-sub{text-align:center;color:#aebdcb;margin:0 0 30px}.weather-now{text-align:center;padding:22px;margin-bottom:22px;border:1px solid rgba(0,234,255,.25);border-radius:18px;background:rgba(2,14,28,.72)}.weather-temp{font-size:46px;font-weight:800;color:#fff}.weather-condition{font-size:20px;color:#dce8f5;margin:5px}.weather-extra{color:#aebdcb}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.forecast-day{text-align:center;padding:17px 8px;border:1px solid rgba(0,234,255,.2);border-radius:14px;background:rgba(2,14,28,.72)}.forecast-name{color:#00eaff;font-weight:700}.forecast-icon{font-size:27px;margin:9px}.forecast-temp{color:#fff;font-weight:700}.detail-status{text-align:center;color:#aebdcb;padding:20px}.detail-page .v2-background{position:fixed;inset:0;z-index:-2;background:url("Image principale V2 Technorizon.png") center top/cover no-repeat}.detail-page .v2-background:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,3,10,.08),rgba(0,3,10,.78))}@media(max-width:760px){.detail-page{padding:20px 14px}.detail-panel{padding:26px 17px}.detail-title{letter-spacing:3px}.forecast{grid-template-columns:repeat(2,1fr)}.forecast-day:last-child{grid-column:1/-1}.detail-page .v2-background{background-image:url("Fond-Smartphones.png")}}
</style></head><body><div class="v2-page detail-page"><div class="v2-background"></div><main class="detail-main"><a class="detail-back" href="index.html">← Retour à Technorizon</a><section class="detail-panel"><h1 class="detail-title">MÉTÉO</h1><p class="detail-sub">Yerville • Aujourd'hui et les prochains jours</p><div id="weather"><div class="detail-status">Chargement de la météo…</div></div></section></main></div><script>
const out=document.getElementById('weather');const labels={0:['☀️','Ciel dégagé'],1:['🌤️','Peu nuageux'],2:['⛅','Partiellement nuageux'],3:['☁️','Couvert'],45:['🌫️','Brouillard'],48:['🌫️','Brouillard givrant'],51:['🌦️','Bruine légère'],53:['🌦️','Bruine'],55:['🌧️','Forte bruine'],61:['🌧️','Pluie légère'],63:['🌧️','Pluie'],65:['🌧️','Forte pluie'],71:['🌨️','Neige légère'],73:['🌨️','Neige'],75:['❄️','Forte neige'],80:['🌦️','Averses légères'],81:['🌧️','Averses'],82:['⛈️','Fortes averses'],95:['⛈️','Orage'],96:['⛈️','Orage avec grêle'],99:['⛈️','Fort orage']};const days=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];async function load(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=49.6684&longitude=0.8955&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FParis&forecast_days=5';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),c=d.current,da=d.daily;if(!c||!da)throw Error();const cc=labels[c.weather_code]||['🌐','Conditions variables'];const cards=da.time.map((date,i)=>{const x=labels[da.weather_code[i]]||['🌐','Variable'];return `<div class="forecast-day"><div class="forecast-name">${i===0?'Aujourd’hui':days[new Date(date+'T12:00:00').getDay()]}</div><div class="forecast-icon">${x[0]}</div><div>${x[1]}</div><div class="forecast-temp">${Math.round(da.temperature_2m_min[i])}° / ${Math.round(da.temperature_2m_max[i])}°</div><div class="weather-extra">Pluie ${da.precipitation_probability_max[i]??0}%</div></div>`}).join('');out.innerHTML=`<div class="weather-now"><div class="weather-temp">${Math.round(c.temperature_2m)}°C</div><div class="weather-condition">${cc[0]} ${cc[1]}</div><div class="weather-extra">Ressenti ${Math.round(c.apparent_temperature)}°C • Humidité ${c.relative_humidity_2m}% • Vent ${Math.round(c.wind_speed_10m)} km/h</div></div><div class="forecast">${cards}</div>`}catch(e){out.innerHTML='<div class="detail-status">Les données météo sont momentanément indisponibles.</div>'}}load();setInterval(load,600000);
</script></body></html>
