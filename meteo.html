<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Météo | Technorizon.fr</title><link rel="icon" type="image/jpeg" href="Logo-Officiel-Technorizon.jpg"><link rel="stylesheet" href="style-v2.css?v=12"><style>body{margin:0;background:#020916;font-family:Arial,sans-serif}.page{min-height:100vh;padding:34px 18px;position:relative;isolation:isolate}.bg{position:fixed;inset:0;z-index:-2;background:url('Fond-Technorizon-V2.png.png') center top/cover no-repeat}.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,5,15,.16),rgba(0,5,15,.40))}.panel{width:min(1000px,100%);box-sizing:border-box;margin:auto;padding:34px 38px;border:1px solid rgba(0,234,255,.32);border-radius:24px;background:rgba(2,12,28,.52);backdrop-filter:blur(7px);box-shadow:0 20px 60px rgba(0,0,0,.3)}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.back{color:#00eaff;text-decoration:none}.lang{display:flex;gap:8px;align-items:center;color:#8293a4}.lang button{border:0;background:none;color:#a9bac9;cursor:pointer}.lang button.active{color:#fff}.title{text-align:center;color:#fff;letter-spacing:6px;font-size:clamp(30px,5vw,46px);margin:30px 0 8px}.sub{text-align:center;color:#aebdcb;margin:0 0 24px}.search{display:flex;justify-content:center;gap:9px;max-width:560px;margin:0 auto 26px}.search input{flex:1;min-width:0;padding:13px 16px;color:#fff;background:rgba(2,14,28,.48);border:1px solid rgba(0,234,255,.3);border-radius:999px}.search button{padding:12px 20px;border:1px solid rgba(0,234,255,.42);border-radius:999px;color:#fff;font-weight:800;cursor:pointer;background:rgba(0,150,220,.12)}.location{text-align:center;color:#00eaff;font-size:13px;font-weight:700;margin:-10px 0 18px}.now{text-align:center;padding:22px;margin-bottom:22px;border:1px solid rgba(0,234,255,.18);border-radius:18px;background:rgba(2,14,28,.38)}.temp{font-size:46px;font-weight:800;color:#fff}.condition{font-size:20px;color:#dce8f5;margin:5px}.extra{color:#aebdcb}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.day{text-align:center;padding:17px 8px;border:1px solid rgba(0,234,255,.18);border-radius:14px;background:rgba(2,14,28,.38)}.dayname{color:#00eaff;font-weight:700}.icon{font-size:27px;margin:9px}.daytemp{color:#fff;font-weight:700}.status{text-align:center;color:#aebdcb;padding:20px}@media(max-width:700px){.page{padding:16px 12px}.panel{padding:24px 20px}.search{flex-direction:column}.forecast{grid-template-columns:repeat(2,1fr)}.day:last-child{grid-column:1/-1}.bg{background-image:url('Fond-Smartphones.png')}}</style></head><body><div class="page"><div class="bg"></div><div class="shade"></div><main class="panel"><div class="top"><a id="back" class="back" href="index.html">← Retour à l'accueil</a><div class="lang"><button id="fr">🇫🇷 Français</button><span>|</span><button id="en">🇬🇧 English</button></div></div><h1 id="title" class="title">MÉTÉO</h1><p id="sub" class="sub">Recherchez une ville dans le monde • Aujourd'hui et les prochains jours</p><form id="weatherSearch" class="search"><input id="cityInput" type="search" autocomplete="off"><button id="searchBtn" type="submit">RECHERCHER</button></form><div id="weatherLocation" class="location">📍 Yerville, France</div><div id="weather"><div class="status">Chargement…</div></div></main></div><script>const tr={fr:{back:"← Retour à l'accueil",title:'MÉTÉO',sub:"Recherchez une ville dans le monde • Aujourd'hui et les prochains jours",ph:'Ville, ex. Rouen, Londres, New York…',search:'RECHERCHER',loading:'Chargement de la météo…',feel:'Ressenti',humidity:'Humidité',wind:'Vent',rain:'Pluie',today:"Aujourd’hui",error:'Les données météo sont momentanément indisponibles.',find:'Recherche de la ville…',notfound:'Ville introuvable.'},en:{back:'← Back to home',title:'WEATHER',sub:'Search for a city worldwide • Today and the next few days',ph:'City, e.g. Rouen, London, New York…',search:'SEARCH',loading:'Loading weather…',feel:'Feels like',humidity:'Humidity',wind:'Wind',rain:'Rain',today:'Today',error:'Weather data is temporarily unavailable.',find:'Searching for the city…',notfound:'City not found.'}};const labels={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Snow'],80:['🌦️','Showers'],95:['⛈️','Thunderstorm']};const out=weather,form=weatherSearch,input=cityInput;let lang=localStorage.getItem('technorizon-lang')||'fr',current={lat:49.6684,lon:0.8955,name:'Yerville',country:'France',timezone:'Europe/Paris'};function render(){const x=tr[lang];document.documentElement.lang=lang;back.textContent=x.back;title.textContent=x.title;sub.textContent=x.sub;input.placeholder=x.ph;searchBtn.textContent=x.search;fr.classList.toggle('active',lang==='fr');en.classList.toggle('active',lang==='en');document.title=(lang==='fr'?'Météo':'Weather')+' | Technorizon.fr'}function setLang(l){lang=l;localStorage.setItem('technorizon-lang',l);render();load()}fr.onclick=()=>setLang('fr');en.onclick=()=>setLang('en');async function load(){const x=tr[lang];out.innerHTML=`<div class="status">${x.loading}</div>`;try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${current.lat}&longitude=${current.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=${encodeURIComponent(current.timezone||'auto')}&forecast_days=5`;const d=await(await fetch(u,{cache:'no-store'})).json(),c=d.current,da=d.daily;weatherLocation.textContent=`📍 ${current.name}${current.country?', '+current.country:''}`;const cc=labels[c.weather_code]||['🌐','Variable'];const cards=da.time.map((date,i)=>`<div class="day"><div class="dayname">${i===0?x.today:new Intl.DateTimeFormat(lang,{weekday:'short'}).format(new Date(date+'T12:00:00'))}</div><div class="icon">${(labels[da.weather_code[i]]||['🌐'])[0]}</div><div class="daytemp">${Math.round(da.temperature_2m_min[i])}° / ${Math.round(da.temperature_2m_max[i])}°</div><div class="extra">${x.rain} ${da.precipitation_probability_max[i]??0}%</div></div>`).join('');out.innerHTML=`<div class="now"><div class="temp">${Math.round(c.temperature_2m)}°C</div><div class="condition">${cc[0]} ${cc[1]}</div><div class="extra">${x.feel} ${Math.round(c.apparent_temperature)}°C • ${x.humidity} ${c.relative_humidity_2m}% • ${x.wind} ${Math.round(c.wind_speed_10m)} km/h</div></div><div class="forecast">${cards}</div>`}catch(e){out.innerHTML=`<div class="status">${x.error}</div>`}}async function searchCity(q){out.innerHTML=`<div class="status">${tr[lang].find}</div>`;try{const d=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=${lang}&format=json`,{cache:'no-store'})).json(),z=d?.results?.[0];if(!z){out.innerHTML=`<div class="status">${tr[lang].notfound}</div>`;return}current={lat:z.latitude,lon:z.longitude,name:z.name,country:z.country||'',timezone:z.timezone||'auto'};localStorage.setItem('technorizon-weather-location',JSON.stringify(current));load()}catch(e){out.innerHTML=`<div class="status">${tr[lang].error}</div>`}}form.onsubmit=e=>{e.preventDefault();if(input.value.trim())searchCity(input.value.trim())};try{const s=JSON.parse(localStorage.getItem('technorizon-weather-location'));if(s?.lat&&s?.lon)current=s}catch(e){}render();load();setInterval(load,600000)</script></body></html>
