<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Techno Runner — Technorizon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030510;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#12224a 0,#08091b 38%,#02030a 75%)}
#app{width:min(100vw,520px);height:100dvh;max-height:920px;position:relative;overflow:hidden;background:linear-gradient(#05071a,#08031a 55%,#02030b)}
header{position:absolute;z-index:15;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.exit{color:#fff;text-decoration:none;background:#071126dd;border:1px solid #20ecff88;border-radius:12px;padding:8px 10px;font-weight:950;font-size:12px}
.logo{font-weight:950;letter-spacing:1.5px;font-size:18px;text-shadow:0 0 12px #00eaff}.logo b{color:#00eaff}.logo i{font-style:normal;color:#ff25c8}
.pill{background:#070b19cc;border:1px solid #27e9ff66;border-radius:14px;padding:7px 10px;font-weight:850;font-size:12px;box-shadow:0 0 16px #00d9ff22}
#road{position:absolute;inset:0;perspective:420px;overflow:hidden;background:radial-gradient(ellipse at 50% 39%,#19eaff55 0,#11103a 14%,#050617 35%,#02030a 68%)}#road:before{content:"";position:absolute;left:7%;right:7%;top:17%;height:65%;border-radius:50% 50% 20% 20%;border:8px solid #21eaff55;box-shadow:0 0 30px #21eaff99,inset 0 0 45px #ff25c844;transform:perspective(420px) rotateX(58deg);animation:tunnelPulse 1.1s linear infinite}@keyframes tunnelPulse{50%{border-color:#ff25c866;box-shadow:0 0 38px #ff25c899,inset 0 0 55px #21eaff55}}
.skyline{position:absolute;left:0;right:0;bottom:44%;height:20%;opacity:.5;background:repeating-linear-gradient(90deg,transparent 0 22px,#101b42 23px 39px,transparent 40px 50px)}
.floor{position:absolute;left:-45%;right:-45%;top:39%;bottom:-25%;transform:rotateX(64deg);transform-origin:50% 0;background:repeating-linear-gradient(0deg,#00eaff55 0 3px,transparent 3px 42px),repeating-linear-gradient(90deg,#ff25c855 0 2px,transparent 2px 16.66%);box-shadow:inset 0 30px 70px #00eaff33;animation:gridRush .55s linear infinite}@keyframes gridRush{to{background-position:0 42px,0 0}}
.lane{position:absolute;top:44%;bottom:0;width:2px;background:linear-gradient(#fff0,#00eaffaa);transform-origin:top}.l1{left:33%;transform:rotate(8deg)}.l2{left:66%;transform:rotate(-8deg)}
#player{position:absolute;z-index:4;bottom:12%;left:50%;width:54px;height:72px;transform:translateX(-50%);transition:left .13s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 12px #00eaff)}
.car{width:100%;height:100%;clip-path:polygon(25% 0,75% 0,100% 78%,78% 100%,22% 100%,0 78%);background:linear-gradient(90deg,#00eaff,#eaffff 48%,#ff25c8);border-radius:15px}.car:after{content:"";position:absolute;left:18%;right:18%;top:14%;height:24%;background:#06112a;border-radius:50% 50% 20% 20%;box-shadow:0 0 8px #fff}
.obj{position:absolute;z-index:3;top:40%;transform:translate(-50%,-50%);font-size:34px;filter:drop-shadow(0 0 8px #00eaff);will-change:top,transform}.obstacle{width:56px;height:42px;background:linear-gradient(135deg,#ff315f,#6d001e);border:2px solid #ff9eb1;border-radius:8px;box-shadow:0 0 16px #ff1744}.coin{color:#ffe25c;font-size:30px;text-shadow:0 0 10px #ffb300}
.center{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:24px;background:#02040ac7;backdrop-filter:blur(5px)}
.card{width:100%;max-width:390px;text-align:center;border:1px solid #25e8ff66;background:#080b1bea;border-radius:24px;padding:24px 18px;box-shadow:0 0 40px #00eaff20}
h1{margin:0;font-size:35px;line-height:.95;font-style:italic}.cyan{color:#20ecff}.pink{color:#ff31cf}.sub{color:#b9c8e7;margin:12px 0 18px;line-height:1.4}
button{border:0;border-radius:16px;padding:14px 18px;font-weight:950;font-size:16px;color:#03101a;background:linear-gradient(90deg,#21eaff,#ff38ce);box-shadow:0 0 22px #00eaff44}
.small{font-size:12px;color:#8394b8;margin-top:13px}.hidden{display:none!important}
#flash{position:absolute;z-index:8;top:22%;width:100%;text-align:center;font-size:28px;font-weight:1000;font-style:italic;text-shadow:0 0 16px #00eaff;pointer-events:none}
#controls{position:absolute;z-index:6;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:80px}
.ctrl{width:74px;height:58px;padding:0;border:1px solid #25e8ff77;background:#05091dcc;color:#fff;font-size:27px;box-shadow:0 0 15px #00eaff22}
</style></head><body><main id="app">
<header><a class="exit" id="exitGame" href="/techno-arcade.html">✕ SORTIR</a><button class="exit" id="radioToggle" type="button">🔊 RADIO</button><div class="logo"><b>TECHNO</b><i>RUNNER</i></div><div class="pill">🏆 <span id="best">0</span></div><div class="pill">🪙 <span id="coins">0</span></div></header>
<div id="road"><div class="skyline"></div><div class="floor"></div><i class="lane l1"></i><i class="lane l2"></i></div>
<div id="player"><div class="car"></div></div><div id="flash"></div>
<div id="controls" class="hidden"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
<section id="intro" class="center"><div class="card"><h1><span class="cyan">TECHNO</span><br><span class="pink">RUNNER</span></h1><p class="sub">Fonce dans la nuit Technorizon. Évite les obstacles, récupère les Techno Coins et tiens le plus longtemps possible pendant que la vitesse augmente.</p><button id="start">⚡ LANCER LA COURSE</button><div class="small">← → ou boutons tactiles · Techno Runner</div></div></section>
<section id="over" class="center hidden"><div class="card"><h1>COURSE <span class="pink">TERMINÉE</span></h1><p class="sub">Score : <b id="scoreEnd">0</b><br>Techno Coins gagnés : <b id="gain">0</b></p><button id="again">🔁 REJOUER</button></div></section>
<audio id="runnerRadio" preload="none" playsinline src="https://radio.technorizon.fr/listen/technorizon/radio.mp3"></audio></main><script>
const lanes=[25,50,75],player=document.querySelector('#player'),app=document.querySelector('#app'),bestEl=document.querySelector('#best'),coinsEl=document.querySelector('#coins'),introEl=document.querySelector('#intro'),overEl=document.querySelector('#over'),controlsEl=document.querySelector('#controls'),flashEl=document.querySelector('#flash'),scoreEndEl=document.querySelector('#scoreEnd'),runnerRadio=document.querySelector('#runnerRadio'),radioToggle=document.querySelector('#radioToggle');
let lane=1,running=false,score=0,gain=0,speed=1,last=0,spawn=0,objects=[];
let best=0,wallet=0;try{best=+(localStorage.getItem('techno-runner-best')||0);wallet=+(localStorage.getItem('techno-runner-coins')||0)}catch(e){}bestEl.textContent=best;coinsEl.textContent=wallet;
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));player.style.left=lanes[lane]+'%'}
function add(type){const el=document.createElement('div');el.className='obj '+type;el.dataset.lane=Math.floor(Math.random()*3);el.dataset.y=40;el.innerHTML=type==='coin'?'◆':'';el.style.left=lanes[+el.dataset.lane]+'%';app.appendChild(el);objects.push(el)}
async function keepRadio(){if(runnerRadio.paused){try{await runnerRadio.play();radioToggle.textContent='🔊 RADIO'}catch(e){radioToggle.textContent='▶ RADIO'}}}radioToggle.addEventListener('click',async()=>{if(runnerRadio.paused)await keepRadio();else{runnerRadio.pause();radioToggle.textContent='▶ RADIO'}});function start(){keepRadio();objects.forEach(o=>o.remove());objects=[];lane=1;player.style.left='50%';score=0;gain=0;speed=1;spawn=0;last=performance.now();running=true;introEl.classList.add('hidden');overEl.classList.add('hidden');controlsEl.classList.remove('hidden');requestAnimationFrame(loop)}
function end(){running=false;controlsEl.classList.add('hidden');best=Math.max(best,Math.floor(score));wallet+=gain;try{localStorage.setItem('techno-runner-best',best);localStorage.setItem('techno-runner-coins',wallet)}catch(e){}bestEl.textContent=best;coinsEl.textContent=wallet;scoreEndEl.textContent=Math.floor(score);document.querySelector('#gain').textContent=gain;overEl.classList.remove('hidden')}
function loop(t){if(!running)return;const dt=Math.min(32,t-last);last=t;score+=dt*.012*speed;speed=1+Math.min(2.8,score/600);spawn+=dt;if(spawn>Math.max(360,900/speed)){spawn=0;add(Math.random()<.32?'coin':'obstacle')}
for(let i=objects.length-1;i>=0;i--){const o=objects[i],y=+o.dataset.y+dt*.055*speed;o.dataset.y=y;o.style.top=y+'%';const scale=.45+(y-40)/60*1.15;o.style.transform='translate(-50%,-50%) scale('+scale+')';if(y>82&&y<94&&+o.dataset.lane===lane){if(o.classList.contains('coin')){gain++;o.remove();objects.splice(i,1);flashEl.textContent='+1 TECHNO COIN';setTimeout(()=>flashEl.textContent='',250);continue}else{return end()}}if(y>108){o.remove();objects.splice(i,1)}}requestAnimationFrame(loop)}
document.querySelector('#start').addEventListener('click',start);
document.querySelector('#again').addEventListener('click',start);
document.querySelector('#left').addEventListener('click',()=>move(-1));
document.querySelector('#right').addEventListener('click',()=>move(1));document.querySelector('#exitGame').addEventListener('click',()=>{running=false;if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});let sx=0;app.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});app.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>30)move(d>0?1:-1)},{passive:true});
</script></body></html>
