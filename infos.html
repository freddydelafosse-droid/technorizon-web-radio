<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Infos | Technorizon.fr</title><link rel="icon" type="image/jpeg" href="Logo-Officiel-Technorizon.jpg"><link rel="stylesheet" href="style-v2.css?v=9"><style>
.detail-page{min-height:100vh;padding:40px 20px;position:relative;isolation:isolate}.detail-main{width:min(1000px,100%);margin:auto}.detail-back{display:inline-block;margin-bottom:25px;color:#dce8f5;text-decoration:none;text-shadow:0 0 10px rgba(0,234,255,.35)}.detail-panel{padding:38px;border:1px solid rgba(0,234,255,.35);border-radius:24px;background:linear-gradient(135deg,rgba(0,20,35,.84),rgba(20,5,40,.82));backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(0,234,255,.08),0 0 50px rgba(255,0,200,.06)}.detail-title{text-align:center;color:#fff;letter-spacing:6px;font-size:clamp(30px,5vw,48px);margin:0 0 8px}.detail-sub{text-align:center;color:#aebdcb;margin:0 0 20px}.country-picker{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 auto 28px}.country-picker label{color:#00eaff;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.country-picker select{min-width:220px;padding:11px 38px 11px 14px;color:#fff;background:#071522;border:1px solid rgba(0,234,255,.35);border-radius:999px;outline:none;cursor:pointer;font-size:14px}.news-list{display:grid;gap:13px}.news-item{padding:17px 19px;border:1px solid rgba(0,234,255,.2);border-radius:14px;background:rgba(2,14,28,.72);color:#eef8ff;line-height:1.45}.news-number{color:#00eaff;font-weight:700;margin-right:8px}.detail-status{text-align:center;color:#aebdcb;padding:20px}.detail-page .v2-background{position:fixed;inset:0;z-index:-2;background:url("Image principale V2 Technorizon.png") center top/cover no-repeat}.detail-page .v2-background:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,3,10,.08),rgba(0,3,10,.78))}@media(max-width:760px){.detail-page{padding:20px 14px}.detail-panel{padding:26px 17px}.detail-title{letter-spacing:3px}.country-picker{flex-direction:column}.country-picker select{width:100%}.detail-page .v2-background{background-image:url("Fond-Smartphones.png")}}
</style></head><body><div class="v2-page detail-page"><div class="v2-background"></div><main class="detail-main"><a class="detail-back" href="index.html">← Retour à Technorizon</a><section class="detail-panel"><h1 class="detail-title">INFOS</h1><p class="detail-sub">L'actualité essentielle • Choisissez votre pays</p><div class="country-picker"><label for="country">🌍 Pays</label><select id="country"><option value="fr">🇫🇷 France</option><option value="be">🇧🇪 Belgique</option><option value="ch">🇨🇭 Suisse</option><option value="gb">🇬🇧 Royaume-Uni</option><option value="us">🇺🇸 États-Unis</option><option value="ca">🇨🇦 Canada</option><option value="de">🇩🇪 Allemagne</option><option value="es">🇪🇸 Espagne</option><option value="it">🇮🇹 Italie</option><option value="pt">🇵🇹 Portugal</option></select></div><div id="news-list" class="news-list"><div class="detail-status">Chargement des informations…</div></div></section></main></div><script>
const list=document.getElementById('news-list'),country=document.getElementById('country');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function loadNews(){const code=country.value;list.innerHTML='<div class="detail-status">Chargement des informations…</div>';try{const r=await fetch(`/api/news?country=${encodeURIComponent(code)}`,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),items=Array.isArray(d?.items)?d.items.filter(x=>x?.title):[];if(!items.length)throw Error();list.innerHTML=items.slice(0,10).map((x,i)=>`<div class="news-item"><span class="news-number">${String(i+1).padStart(2,'0')}</span>${esc(x.title)}</div>`).join('')}catch(e){list.innerHTML='<div class="detail-status">Les informations sont momentanément indisponibles pour ce pays.</div>'}}const saved=localStorage.getItem('technorizon-news-country');if(saved&&[...country.options].some(o=>o.value===saved))country.value=saved;country.addEventListener('change',()=>{localStorage.setItem('technorizon-news-country',country.value);loadNews()});loadNews();setInterval(loadNews,300000);
</script></body></html>
