mentById('news-list'),sel=document.getElementById('langSelect');let region=localStorage.getItem('technorizon-region')||'fr';if(!R[region])region='fr';let lang=R[region];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function fill(){sel.innerHTML='';Object.keys(R).forEach(r=>sel.add(new Option(F[r]+' '+(N[lang]?.[r]||N.en[r]),r)));sel.value=region}function render(){lang=R[region];const x=T[lang];document.documentElement.lang=lang;back.textContent=x[0];title.textContent=x[1];sub.textContent=x[2];fill();document.title=x[1]+' | Technorizon.fr'}async function loadNews(){const x=T[lang];list.innerHTML='<div class="detail-status">'+x[3]+'</div>';try{const r=await fetch('/api/news?country='+region,{cache:'no-store'}),d=await r.json(),items=Array.isArray(d?.items)?d.items.filter(v=>v?.title):[];if(!items.length)throw Error();list.innerHTML=items.slice(0,10).map((v,i)=>'<div class="news-item"><span class="news-number">'+String(i+1).padStart(2,'0')+'</span>'+esc(v.title)+'</div>').join('')}catch(e){list.innerHTML='<div class="detail-status">'+x[4]+'</div>'}}sel.onchange=()=>{region=sel.value;localStorage.setItem('technorizon-region',region);localStorage.setItem('technorizon-lang',R[region]);render();loadNews()};render();loadNews();setInterval(loadNews,300000)</script></body></html>
