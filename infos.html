<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Infos | Technorizon.fr</title><link rel="icon" type="image/jpeg" href="Logo-Officiel-Technorizon.jpg"><link rel="stylesheet" href="style-v2.css?v=12"><style>html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:#020916;font-family:Arial,sans-serif}.detail-page{width:100%;max-width:100%;min-height:100vh;padding:34px 18px;position:relative;isolation:isolate;overflow-x:hidden}.detail-main{width:min(1000px,100%);max-width:100%;min-width:0;margin:auto}.detail-panel{width:100%;max-width:100%;min-width:0;padding:34px 38px;border:1px solid rgba(0,234,255,.32);border-radius:24px;background:rgba(2,12,28,.52);backdrop-filter:blur(7px);box-shadow:0 20px 60px rgba(0,0,0,.30);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;min-width:0}.detail-back{color:#00eaff;text-decoration:none}.lang{display:flex;gap:8px;align-items:center;color:#8293a4;max-width:100%}.lang button{border:0;background:none;color:#a9bac9;cursor:pointer}.lang button.active{color:#fff}.detail-title{text-align:center;color:#fff;letter-spacing:6px;font-size:clamp(30px,5vw,46px);margin:30px 0 8px}.detail-sub{text-align:center;color:#aebdcb;margin:0 0 24px;overflow-wrap:anywhere}.country-picker{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 auto 28px;max-width:100%}.country-picker label{color:#00eaff;font-size:12px;font-weight:800;letter-spacing:1px}.country-picker select{min-width:0;max-width:100%;width:220px;padding:11px 14px;color:#fff;background:rgba(2,14,28,.62);border:1px solid rgba(0,234,255,.35);border-radius:999px}.news-list{display:grid;gap:13px;min-width:0}.news-item{min-width:0;max-width:100%;padding:17px 19px;border:1px solid rgba(0,234,255,.18);border-radius:14px;background:rgba(2,14,28,.38);color:#eef8ff;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}.news-number{color:#00eaff;font-weight:700;margin-right:8px}.detail-status{text-align:center;color:#aebdcb;padding:20px}.v2-background{position:fixed;inset:0;z-index:-2;background:url('Fond-Technorizon-V2.png.png') center top/cover no-repeat}.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,5,15,.16),rgba(0,5,15,.40))}@media(max-width:700px){.detail-page{padding:16px 12px}.detail-panel{padding:24px 20px}.country-picker{flex-direction:column}.country-picker select{width:100%}.v2-background{background-image:url('Fond-Technorizon-V2.png.png')}}</style></head><body><div class="detail-page"><div class="v2-background"></div><div class="shade"></div><main class="detail-main"><section class="detail-panel"><div class="top"><a id="back" class="detail-back" href="index.html">← Retour à l'accueil</a><div class="lang"><button id="fr">🇫🇷 Français</button><span>|</span><button id="en">🇬🇧 English</button></div></div><h1 id="title" class="detail-title">INFOS</h1><p id="sub" class="detail-sub">L'actualité essentielle • Choisissez votre pays</p><div class="country-picker"><label id="countryLabel" for="country">🌍 Pays</label><select id="country"><option value="fr">🇫🇷 France</option><option value="be">🇧🇪 Belgique</option><option value="ch">🇨🇭 Suisse</option><option value="gb">🇬🇧 Royaume-Uni</option><option value="us">🇺🇸 États-Unis</option><option value="ca">🇨🇦 Canada</option><option value="de">🇩🇪 Allemagne</option><option value="es">🇪🇸 Espagne</option><option value="it">🇮🇹 Italie</option><option value="pt">🇵🇹 Portugal</option></select></div><div id="news-list" class="news-list"></div></section></main></div><script>const tx={fr:{back:"← Retour à l'accueil",title:'INFOS',sub:"L'actualité essentielle • Choisissez votre pays",country:'🌍 Pays',loading:'Chargement des informations…',error:'Les informations sont momentanément indisponibles pour ce pays.',names:['France','Belgique','Suisse','Royaume-Uni','États-Unis','Canada','Allemagne','Espagne','Italie','Portugal']},en:{back:'← Back to home',title:'NEWS',sub:'Essential news • Choose your country',country:'🌍 Country',loading:'Loading news…',error:'News is temporarily unavailable for this country.',names:['France','Belgium','Switzerland','United Kingdom','United States','Canada','Germany','Spain','Italy','Portugal']}};const list=document.getElementById('news-list'),country=document.getElementById('country');let lang=localStorage.getItem('technorizon-lang')||'fr';const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(){const x=tx[lang];document.documentElement.lang=lang;back.textContent=x.back;title.textContent=x.title;sub.textContent=x.sub;countryLabel.textContent=x.country;[...country.options].forEach((o,i)=>o.textContent=o.textContent.slice(0,5)+x.names[i]);fr.classList.toggle('active',lang==='fr');en.classList.toggle('active',lang==='en');document.title=(lang==='fr'?'Infos':'News')+' | Technorizon.fr'}function setLang(l){lang=l;localStorage.setItem('technorizon-lang',l);render()}fr.onclick=()=>setLang('fr');en.onclick=()=>setLang('en');async function loadNews(){list.innerHTML=`<div class="detail-status">${tx[lang].loading}</div>`;try{const r=await fetch(`/api/news?country=${country.value}`,{cache:'no-store'}),d=await r.json(),items=Array.isArray(d?.items)?d.items.filter(x=>x?.title):[];if(!items.length)throw Error();list.innerHTML=items.slice(0,10).map((x,i)=>`<div class="news-item"><span class="news-number">${String(i+1).padStart(2,'0')}</span>${esc(x.title)}</div>`).join('')}catch(e){list.innerHTML=`<div class="detail-status">${tx[lang].error}</div>`}}const saved=localStorage.getItem('technorizon-news-country');if(saved&&[...country.options].some(o=>o.value===saved))country.value=saved;country.onchange=()=>{localStorage.setItem('technorizon-news-country',country.value);loadNews()};render();loadNews();setInterval(loadNews,300000)</script></body></html>
