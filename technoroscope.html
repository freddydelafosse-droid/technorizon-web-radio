<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technoroscope | Technorizon.fr</title><link rel="icon" type="image/jpeg" href="Logo-Officiel-Technorizon.jpg"><link rel="stylesheet" href="style-v2.css?v=12"><style>body{margin:0;background:#020916;font-family:Arial,sans-serif}.page{min-height:100vh;padding:34px 18px;position:relative;isolation:isolate}.bg{position:fixed;inset:0;z-index:-2;background:url('Fond-Technorizon-V2.png.png') center top/cover no-repeat}.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,5,15,.16),rgba(0,5,15,.40))}.panel{width:min(1000px,100%);box-sizing:border-box;margin:auto;padding:34px 38px;border:1px solid rgba(0,234,255,.32);border-radius:24px;background:rgba(2,12,28,.52);backdrop-filter:blur(7px);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.back{color:#00eaff;text-decoration:none}.lang{display:flex;gap:8px;align-items:center;color:#8293a4}.lang button{border:0;background:none;color:#a9bac9;cursor:pointer}.lang button.active{color:#fff}.panel h1{color:#fff;letter-spacing:6px;font-size:clamp(30px,5vw,46px);margin:30px 0 8px}.intro{color:#aebdcb;margin:0 0 28px}.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.signs button{padding:16px 10px;border:1px solid rgba(0,234,255,.2);border-radius:14px;background:rgba(2,14,28,.38);color:#fff;cursor:pointer;font-size:15px}.signs button:hover,.signs button.active{border-color:#00eaff;background:rgba(0,180,220,.12)}.result{margin-top:28px;padding:24px;border-top:1px solid rgba(0,234,255,.18);color:#dce8f5;font-size:18px;line-height:1.6}@media(max-width:700px){.page{padding:16px 12px}.panel{padding:24px 20px}.signs{grid-template-columns:repeat(2,1fr)}.bg{background-image:url('Fond-Smartphones.png')}}</style></head><body><div class="page"><div class="bg"></div><div class="shade"></div><main class="panel"><div class="top"><a href="index.html" class="back" id="back">← Retour à l'accueil</a><div class="lang"><button id="frBtn">🇫🇷 Français</button><span>|</span><button id="enBtn">🇬🇧 English</button></div></div><h1>TECHNOROSCOPE</h1><p class="intro" id="intro"></p><div class="signs"><button data-sign="belier">♈ <span></span></button><button data-sign="taureau">♉ <span></span></button><button data-sign="gemeaux">♊ <span></span></button><button data-sign="cancer">♋ <span></span></button><button data-sign="lion">♌ <span></span></button><button data-sign="vierge">♍ <span></span></button><button data-sign="balance">♎ <span></span></button><button data-sign="scorpion">♏ <span></span></button><button data-sign="sagittaire">♐ <span></span></button><button data-sign="capricorne">♑ <span></span></button><button data-sign="verseau">♒ <span></span></button><button data-sign="poissons">♓ <span></span></button></div><div id="result" class="result"></div></main></div><script>const data={fr:{intro:'Découvrez votre horoscope du jour version Technorizon.',back:"← Retour à l'accueil",choose:'Sélectionnez votre signe pour découvrir votre Technoroscope du jour.',signs:{belier:['Bélier','Votre énergie est en mode BPM élevé. Profitez de cet élan pour avancer sur ce qui vous tient vraiment à cœur.'],taureau:['Taureau','Gardez votre tempo. Inutile d’accélérer aujourd’hui : les meilleures choses arrivent au bon rythme.'],gemeaux:['Gémeaux','Une rencontre ou un message pourrait changer la tonalité de votre journée. Restez attentif aux signaux.'],cancer:['Cancer','Écoutez votre intuition : aujourd’hui, elle semble parfaitement calée sur la bonne fréquence.'],lion:['Lion','Les projecteurs sont sur vous. Assumez votre énergie et faites entendre votre différence.'],vierge:['Vierge','Quelques réglages suffiront à remettre votre journée dans le tempo. Ne cherchez pas à tout contrôler.'],balance:['Balance','Cherchez l’harmonie sans oublier votre propre mélodie. Un compromis pourrait débloquer une situation.'],scorpion:['Scorpion','L’intensité monte aujourd’hui. Utilisez cette énergie pour avancer sans pousser le volume trop loin.'],sagittaire:['Sagittaire','Besoin d’air et de nouveauté ? Changez de route, de playlist ou simplement de perspective.'],capricorne:['Capricorne','Votre constance commence à payer. Continuez d’avancer piste après piste : le résultat se rapproche.'],verseau:['Verseau','Une idée originale pourrait faire toute la différence. Aujourd’hui, osez sortir du format.'],poissons:['Poissons','Laissez parler votre sensibilité. Certaines émotions méritent simplement d’être écoutées.']}},en:{intro:'Discover your daily horoscope, Technorizon edition.',back:'← Back to home',choose:'Select your zodiac sign to discover your Technoroscope for today.',signs:{belier:['Aries','Your energy is running at a high BPM. Use this momentum to move forward on what truly matters to you.'],taureau:['Taurus','Keep your tempo. There is no need to speed up today: the best things arrive at the right rhythm.'],gemeaux:['Gemini','A meeting or message could change the tone of your day. Stay alert to the signals around you.'],cancer:['Cancer','Trust your intuition: today it seems perfectly tuned to the right frequency.'],lion:['Leo','The spotlight is on you. Own your energy and let your difference be heard.'],vierge:['Virgo','A few adjustments will be enough to put your day back on tempo. Do not try to control everything.'],balance:['Libra','Look for harmony without forgetting your own melody. A compromise could unlock a situation.'],scorpion:['Scorpio','The intensity is rising today. Use that energy to move forward without pushing the volume too far.'],sagittaire:['Sagittarius','Need some fresh air and something new? Change your route, your playlist, or simply your perspective.'],capricorne:['Capricorn','Your consistency is starting to pay off. Keep moving forward track by track.'],verseau:['Aquarius','An original idea could make all the difference. Dare to step outside the format.'],poissons:['Pisces','Let your sensitivity speak. Some emotions simply deserve to be listened to.']}}};const result=document.getElementById('result'),buttons=[...document.querySelectorAll('.signs button')];let lang=localStorage.getItem('technorizon-lang')||'fr',selected=null;function render(){document.documentElement.lang=lang;intro.textContent=data[lang].intro;back.textContent=data[lang].back;frBtn.classList.toggle('active',lang==='fr');enBtn.classList.toggle('active',lang==='en');buttons.forEach(b=>b.querySelector('span').textContent=data[lang].signs[b.dataset.sign][0]);result.textContent=selected?data[lang].signs[selected][1]:data[lang].choose}function setLang(l){lang=l;localStorage.setItem('technorizon-lang',l);render()}frBtn.onclick=()=>setLang('fr');enBtn.onclick=()=>setLang('en');buttons.forEach(b=>b.onclick=()=>{selected=b.dataset.sign;buttons.forEach(x=>x.classList.toggle('active',x===b));render()});render()</script></body></html>
