<!DOCTYPE html>
<html lang="fr">
<head>

</head>
<body><div class="v2-page technoroscope-page"><div class="v2-background"></div><main class="technoroscope-main"><a href="index.html" class="technoroscope-back" id="back">← Retour à Technorizon</a><section class="technoroscope-panel"><div class="lang-switch"><button id="frBtn">🇫🇷 Français</button><span>|</span><button id="enBtn">🇬🇧 English</button></div><h1>TECHNOROSCOPE</h1><p class="technoroscope-intro" id="intro">Découvrez votre horoscope du jour version Technorizon.</p><div class="technoroscope-signs"><button data-sign="belier">♈ <span>Bélier</span></button><button data-sign="taureau">♉ <span>Taureau</span></button><button data-sign="gemeaux">♊ <span>Gémeaux</span></button><button data-sign="cancer">♋ <span>Cancer</span></button><button data-sign="lion">♌ <span>Lion</span></button><button data-sign="vierge">♍ <span>Vierge</span></button><button data-sign="balance">♎ <span>Balance</span></button><button data-sign="scorpion">♏ <span>Scorpion</span></button><button data-sign="sagittaire">♐ <span>Sagittaire</span></button><button data-sign="capricorne">♑ <span>Capricorne</span></button><button data-sign="verseau">♒ <span>Verseau</span></button><button data-sign="poissons">♓ <span>Poissons</span></button></div><div id="technoroscope-result" class="technoroscope-result">Sélectionnez votre signe pour découvrir votre Technoroscope du jour.</div></section></main></div>
<style>
.technoroscope-page{min-height:100vh;padding:40px 20px;position:relative;isolation:isolate}.technoroscope-page .v2-background{position:fixed;inset:0;z-index:-2;background-image:url("Image principale V2 Technorizon.png");background-position:center top;background-repeat:no-repeat;background-size:cover}.technoroscope-page .v2-background::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,3,10,.08) 0%,rgba(0,3,10,.25) 48%,rgba(0,3,10,.78) 100%)}.technoroscope-main{width:min(1100px,100%);margin:0 auto}.technoroscope-back{display:inline-block;margin-bottom:25px;color:#dce8f5;text-decoration:none;font-size:15px;text-shadow:0 0 10px rgba(0,234,255,.35)}.technoroscope-back:hover{color:#00eaff}.technoroscope-panel{padding:45px;border:1px solid rgba(0,234,255,.35);border-radius:24px;background:linear-gradient(135deg,rgba(0,20,35,.82),rgba(20,5,40,.80));backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(0,234,255,.08),0 0 50px rgba(255,0,200,.06);text-align:center}.lang-switch{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:22px;color:#8293a4;font-size:12px}.lang-switch button{border:0;background:none;color:#a9bac9;cursor:pointer;padding:5px 7px;font:inherit}.lang-switch button.active{color:#fff;text-shadow:0 0 9px rgba(0,234,255,.6)}.technoroscope-panel h1{margin:0;color:#fff;font-size:clamp(32px,5vw,52px);letter-spacing:7px;text-shadow:0 0 18px rgba(0,234,255,.28),0 0 26px rgba(255,31,157,.16)}.technoroscope-intro{margin:15px 0 35px;color:#aebdcb;font-size:18px}.technoroscope-signs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.technoroscope-signs button{padding:17px 12px;border:1px solid rgba(0,234,255,.35);border-radius:14px;background:rgba(2,14,28,.78);color:#fff;font-size:16px;cursor:pointer;transition:.2s}.technoroscope-signs button:hover,.technoroscope-signs button.active{transform:translateY(-2px);border-color:#00eaff;background:linear-gradient(135deg,rgba(0,234,255,.14),rgba(255,31,157,.12));box-shadow:0 0 16px rgba(0,234,255,.22),0 0 20px rgba(255,0,200,.12)}.technoroscope-result{margin-top:35px;padding:28px;min-height:80px;border-top:1px solid rgba(0,234,255,.25);color:#dce8f5;font-size:19px;line-height:1.6}@media(max-width:800px){.technoroscope-page{padding:20px 14px}.technoroscope-page .v2-background{background-image:url("Fond-Smartphones.png");background-position:center top}.technoroscope-panel{padding:28px 18px}.technoroscope-panel h1{letter-spacing:3px}.technoroscope-signs{grid-template-columns:repeat(2,1fr)}.technoroscope-signs button{padding:15px 8px;font-size:15px}.technoroscope-result{padding:22px 5px;font-size:17px}}
</style>
<script>
const data={fr:{intro:'Découvrez votre horoscope du jour version Technorizon.',back:'← Retour à Technorizon',choose:'Sélectionnez votre signe pour découvrir votre Technoroscope du jour.',signs:{belier:['Bélier','Votre énergie est en mode BPM élevé. Profitez de cet élan pour avancer sur ce qui vous tient vraiment à cœur.'],taureau:['Taureau','Gardez votre tempo. Inutile d’accélérer aujourd’hui : les meilleures choses arrivent au bon rythme.'],gemeaux:['Gémeaux','Une rencontre ou un message pourrait changer la tonalité de votre journée. Restez attentif aux signaux.'],cancer:['Cancer','Écoutez votre intuition : aujourd’hui, elle semble parfaitement calée sur la bonne fréquence.'],lion:['Lion','Les projecteurs sont sur vous. Assumez votre énergie et faites entendre votre différence.'],vierge:['Vierge','Quelques réglages suffiront à remettre votre journée dans le tempo. Ne cherchez pas à tout contrôler.'],balance:['Balance','Cherchez l’harmonie sans oublier votre propre mélodie. Un compromis pourrait débloquer une situation.'],scorpion:['Scorpion','L’intensité monte aujourd’hui. Utilisez cette énergie pour avancer sans pousser le volume trop loin.'],sagittaire:['Sagittaire','Besoin d’air et de nouveauté ? Changez de route, de playlist ou simplement de perspective.'],capricorne:['Capricorne','Votre constance commence à payer. Continuez d’avancer piste après piste : le résultat se rapproche.'],verseau:['Verseau','Une idée originale pourrait faire toute la différence. Aujourd’hui, osez sortir du format.'],poissons:['Poissons','Laissez parler votre sensibilité. Certaines émotions méritent simplement d’être écoutées.']}},en:{intro:'Discover your daily horoscope, Technorizon edition.',back:'← Back to Technorizon',choose:'Select your zodiac sign to discover your Technoroscope for today.',signs:{belier:['Aries','Your energy is running at a high BPM. Use this momentum to move forward on what truly matters to you.'],taureau:['Taurus','Keep your tempo. There is no need to speed up today: the best things arrive at the right rhythm.'],gemeaux:['Gemini','A meeting or message could change the tone of your day. Stay alert to the signals around you.'],cancer:['Cancer','Trust your intuition: today it seems perfectly tuned to the right frequency.'],lion:['Leo','The spotlight is on you. Own your energy and let your difference be heard.'],vierge:['Virgo','A few adjustments will be enough to put your day back on tempo. Do not try to control everything.'],balance:['Libra','Look for harmony without forgetting your own melody. A compromise could unlock a situation.'],scorpion:['Scorpio','The intensity is rising today. Use that energy to move forward without pushing the volume too far.'],sagittaire:['Sagittarius','Need some fresh air and something new? Change your route, your playlist, or simply your perspective.'],capricorne:['Capricorn','Your consistency is starting to pay off. Keep moving forward track by track: the result is getting closer.'],verseau:['Aquarius','An original idea could make all the difference. Today, dare to step outside the format.'],poissons:['Pisces','Let your sensitivity speak. Some emotions simply deserve to be listened to.']}}};
const result=document.getElementById('technoroscope-result'),buttons=[...document.querySelectorAll('.technoroscope-signs button')],intro=document.getElementById('intro'),back=document.getElementById('back'),frBtn=document.getElementById('frBtn'),enBtn=document.getElementById('enBtn');let lang=localStorage.getItem('technorizon-lang')||'fr',selected=null;function render(){document.documentElement.lang=lang;intro.textContent=data[lang].intro;back.textContent=data[lang].back;frBtn.classList.toggle('active',lang==='fr');enBtn.classList.toggle('active',lang==='en');buttons.forEach(b=>b.querySelector('span').textContent=data[lang].signs[b.dataset.sign][0]);if(selected){const x=data[lang].signs[selected];result.innerHTML=`<strong>${x[0]} ${buttons.find(b=>b.dataset.sign===selected).textContent.trim().charAt(0)}</strong><br><br>${x[1]}`}else result.textContent=data[lang].choose}function setLang(l){lang=l;localStorage.setItem('technorizon-lang',l);render()}frBtn.onclick=()=>setLang('fr');enBtn.onclick=()=>setLang('en');buttons.forEach(b=>b.onclick=()=>{selected=b.dataset.sign;buttons.forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
