<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>TECHNO-SNAKE · Prototype</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#10203d,#03050b 55%);color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;overflow:hidden}.wrap{width:min(94vw,520px);text-align:center}h1{margin:8px 0 0;font-size:clamp(28px,8vw,44px);letter-spacing:2px;text-shadow:0 0 16px #00eaff,0 0 24px #ff21d0}.sub{color:#9defff;margin:2px 0 10px}.hud{display:flex;justify-content:space-between;font-weight:800;margin:0 4px 8px}canvas{width:100%;aspect-ratio:1;background:#030812;border:2px solid #00eaff;border-radius:18px;box-shadow:0 0 20px #00eaff55,0 0 38px #ff21d033;touch-action:none}.msg{height:26px;margin:8px 0;color:#fff;font-weight:700}.controls{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:7px}.controls button,.start{border:1px solid #00eaff;background:#091326;color:white;border-radius:14px;font-size:25px;height:52px;box-shadow:0 0 10px #00eaff55}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.start{font-size:16px;padding:0 18px;margin-top:8px;background:linear-gradient(90deg,#052c38,#391034)}.note{font-size:12px;color:#8aa4b5;margin-top:8px}</style></head><body><main class="wrap"><h1>TECHNO-SNAKE</h1><div class="sub">Prototype privé · Game Zone Technorizon</div><div class="hud"><span>SCORE <b id="score">0</b></span><span>NIVEAU <b id="level">1</b></span><span>RECORD <b id="best">0</b></span></div><canvas id="c" width="420" height="420"></canvas><div class="msg" id="msg">Glisse sur le jeu ou utilise les flèches</div><div class="controls"><button class="up" data-d="u">▲</button><button class="left" data-d="l">◀</button><button class="down" data-d="d">▼</button><button class="right" data-d="r">▶</button></div><button class="start" id="start">NOUVELLE PARTIE</button><div class="note">Test séparé du site public</div></main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),S=20,N=c.width/S;
let snake,dir,next,food,bonus,score,level,timer,running=false,best=+localStorage.technoSnakeBest||0;
bestEl=document.getElementById('best');bestEl.textContent=best;
function rnd(){return {x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
function free(p){return !snake.some(s=>s.x===p.x&&s.y===p.y)}
function spawn(){do food=rnd();while(!free(food)); if(Math.random()<.28){do bonus=rnd();while(!free(bonus)||(bonus.x===food.x&&bonus.y===food.y))}else bonus=null}
function start(){clearTimeout(timer);snake=[{x:10,y:12},{x:9,y:12},{x:8,y:12},{x:7,y:12}];dir=next={x:1,y:0};score=0;level=1;running=true;spawn();hud();document.getElementById('msg').textContent='GO !';loop()}
function hud(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;bestEl.textContent=best}
function setDir(d){let q=d==='u'?{x:0,y:-1}:d==='d'?{x:0,y:1}:d==='l'?{x:-1,y:0}:{x:1,y:0};if(q.x!==-dir.x||q.y!==-dir.y)next=q}
function loop(){if(!running)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){running=false;document.getElementById('msg').textContent='GAME OVER · '+score+' points';draw();return}snake.unshift(h);let ate=false;if(h.x===food.x&&h.y===food.y){score+=10;ate=true;spawn()}if(bonus&&h.x===bonus.x&&h.y===bonus.y){score+=30;ate=true;bonus=null}if(!ate)snake.pop();level=1+Math.floor(score/70);if(score>best){best=score;localStorage.technoSnakeBest=best}hud();draw();timer=setTimeout(loop,Math.max(55,145-(level-1)*10))}
function draw(){x.fillStyle='#030812';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#0b2230';x.lineWidth=1;for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}snake.forEach((s,i)=>{x.shadowBlur=i?8:18;x.shadowColor=i%2?'#ff21d0':'#00eaff';x.fillStyle=i?'#18dbe5':'#fff';x.fillRect(s.x*S+2,s.y*S+2,S-4,S-4)});x.shadowBlur=18;x.shadowColor='#ff21d0';x.fillStyle='#ff21d0';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,6,0,7);x.fill();if(bonus){x.shadowColor='#ffe85c';x.fillStyle='#ffe85c';x.fillRect(bonus.x*S+5,bonus.y*S+5,10,10)}x.shadowBlur=0}
document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();setDir(e.key.slice(5,6).toLowerCase())}});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setDir(b.dataset.d));document.getElementById('start').onclick=start;
let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});start();
</script></body></html>
