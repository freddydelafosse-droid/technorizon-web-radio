<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TECHNO-SNAKE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:#050713;color:#fff;font-family:Arial,sans-serif;text-align:center}.app{max-width:520px;margin:auto;padding:14px}.logo{max-width:320px;width:75%;height:auto}.title{margin:4px 0;font-size:36px;text-shadow:0 0 12px #00eaff,0 0 20px #ff2bd6}.sub{color:#aeb8d6;margin:0 0 10px}.hud{display:flex;gap:8px;margin-bottom:10px}.hud div{flex:1;background:#090d20;border:1px solid #25315f;border-radius:12px;padding:8px}.hud b{display:block;color:#00efff;font-size:20px}.hud span{font-size:10px;color:#aeb8d6}.stage{position:relative;width:100%;aspect-ratio:1;background:linear-gradient(135deg,#00eaff,#7b39ff,#ff2bd6);padding:5px;border-radius:17px;touch-action:none}canvas{display:block;width:100%;height:100%;background:#050816;border-radius:13px}.overlay{position:absolute;inset:5px;background:rgba(3,6,17,.88);border-radius:13px;display:flex;align-items:center;justify-content:center;padding:20px}.btn{font-size:20px;font-weight:bold;border:0;border-radius:30px;padding:15px 34px;background:#00eaff;color:#041018;touch-action:manipulation}.hint{font-size:12px;color:#9ba7c9}
</style></head><body><main class="app">
<img class="logo" src="ImageLogoFinal.png" alt="TECHNORIZON.FR"><h1 class="title">TECHNO-SNAKE</h1><p class="sub">Attrape le son. Fais monter le score.</p>
<div class="hud"><div><b id="score">0</b><span>SCORE</span></div><div><b id="best">0</b><span>RECORD</span></div><div><b id="level">1</b><span>NIVEAU</span></div></div>
<div class="stage" id="stage"><canvas id="game" width="480" height="480"></canvas><div class="overlay" id="overlay"><div><h2 id="message">Prêt ? 🎧</h2><p>Glisse ton doigt pour diriger le serpent.</p><button id="playButton" class="btn" type="button">JOUER</button></div></div></div>
<p class="hint">📱 Swipe sur mobile • ⌨️ Flèches sur ordinateur</p></main>
<script>
(function(){
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var overlay=document.getElementById("overlay");
var button=document.getElementById("playButton");
var scoreNode=document.getElementById("score");
var bestNode=document.getElementById("best");
var levelNode=document.getElementById("level");
var grid=24, cell=20, snake=[], food={}, dx=1,dy=0,nextX=1,nextY=0,score=0,best=0,eaten=0,running=false,timer=null,sx=0,sy=0;
try{best=parseInt(localStorage.getItem("technoSnakeBest")||"0",10)||0;}catch(err){best=0;}
bestNode.innerHTML=best;
function randomFood(){var ok=false,x,y;while(!ok){x=Math.floor(Math.random()*grid);y=Math.floor(Math.random()*grid);ok=true;for(var i=0;i<snake.length;i++){if(snake[i].x===x&&snake[i].y===y){ok=false;break;}}}food={x:x,y:y};}
function reset(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}];dx=1;dy=0;nextX=1;nextY=0;score=0;eaten=0;scoreNode.innerHTML="0";levelNode.innerHTML="1";randomFood();draw();}
function draw(){ctx.fillStyle="#050816";ctx.fillRect(0,0,480,480);ctx.fillStyle="#00eaff";for(var i=0;i<snake.length;i++){ctx.fillRect(snake[i].x*cell+2,snake[i].y*cell+2,cell-4,cell-4);}ctx.fillStyle="#ff42d4";ctx.beginPath();ctx.arc(food.x*cell+10,food.y*cell+10,7,0,Math.PI*2);ctx.fill();}
function speed(){var v=145-Math.floor(eaten/5)*12;return v<70?70:v;}
function tick(){if(!running)return;dx=nextX;dy=nextY;var h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=grid||h.y>=grid){gameOver();return;}for(var i=0;i<snake.length;i++){if(snake[i].x===h.x&&snake[i].y===h.y){gameOver();return;}}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;eaten++;scoreNode.innerHTML=score;levelNode.innerHTML=1+Math.floor(eaten/5);if(score>best){best=score;bestNode.innerHTML=best;try{localStorage.setItem("technoSnakeBest",String(best));}catch(err){}}randomFood();}else{snake.pop();}draw();timer=setTimeout(tick,speed());}
function startGame(){if(timer){clearTimeout(timer);timer=null;}reset();running=true;overlay.style.display="none";timer=setTimeout(tick,speed());}
function gameOver(){running=false;if(timer){clearTimeout(timer);timer=null;}document.getElementById("message").innerHTML="GAME OVER<br><small>Score : "+score+"</small>";button.innerHTML="REJOUER";overlay.style.display="flex";}
function direction(x,y){if(!running)return;if(x===-dx&&y===-dy)return;nextX=x;nextY=y;}
button.onclick=function(){startGame();return false;};
document.addEventListener("keydown",function(e){var k=e.keyCode;if(k===38)direction(0,-1);else if(k===40)direction(0,1);else if(k===37)direction(-1,0);else if(k===39)direction(1,0);});
var stage=document.getElementById("stage");
stage.addEventListener("touchstart",function(e){if(!e.touches.length)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener("touchend",function(e){if(!e.changedTouches.length)return;var ax=e.changedTouches[0].clientX-sx,ay=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(ax),Math.abs(ay))<15)return;if(Math.abs(ax)>Math.abs(ay))direction(ax>0?1:-1,0);else direction(0,ay>0?1:-1);},{passive:true});
reset();
})();
</script></body></html>
