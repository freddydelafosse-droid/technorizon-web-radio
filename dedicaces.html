<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/jpeg" href="Logo-Officiel-Technorizon.jpg"><link rel="stylesheet" href="style-v2.css?v=12"><style>body{margin:0;background:#020916;font-family:Arial,sans-serif}.page{min-height:100vh;padding:34px 18px;position:relative;isolation:isolate}.page .v2-background{position:fixed;inset:0;z-index:-2;background:url('Fond-Technorizon-V2.png.png') center top/cover no-repeat}.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,5,15,.16),rgba(0,5,15,.40))}.box{width:min(700px,100%);margin:auto;padding:34px 38px;border:1px solid rgba(0,234,255,.32);border-radius:24px;background:rgba(2,12,28,.52);backdrop-filter:blur(7px);box-shadow:0 20px 60px rgba(0,0,0,.30)}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.back{color:#00eaff;text-decoration:none}.lang-switch{display:flex;align-items:center;gap:8px;color:#8293a4;font-size:12px}.lang-switch button{border:0;background:none;color:#a9bac9;cursor:pointer}.lang-switch button.active{color:#fff}.box h1{text-align:center;color:#fff;letter-spacing:5px;margin:34px 0 8px}.box .intro{text-align:center;color:#a9bac9;margin-bottom:28px}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;color:#00eaff;font-size:12px;text-transform:uppercase;letter-spacing:1px}.field input,.field textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid rgba(0,234,255,.25);border-radius:12px;background:rgba(0,5,15,.48);color:#fff;font:inherit}.field textarea{min-height:120px;resize:vertical}.send{display:block;margin:20px auto 0;padding:12px 24px;border:1px solid rgba(0,234,255,.5);border-radius:999px;background:rgba(0,150,220,.12);color:#fff;font-weight:700;cursor:pointer}.status{text-align:center;margin-top:15px;color:#a9bac9}@media(max-width:700px){.page{padding:16px 12px}.box{padding:24px 20px}}</style><title>Envoyez votre dédicace | Technorizon.fr</title><meta name="description" content="Envoyez votre message ou votre dédicace à Technorizon.fr et partagez-la avec les auditeurs de la web-radio."><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><meta name="author" content="Technorizon.fr"><link rel="canonical" href="https://technorizon.fr/dedicaces.html"><meta property="og:locale" content="fr_FR"><meta property="og:type" content="website"><meta property="og:site_name" content="Technorizon.fr"><meta property="og:title" content="Envoyez votre dédicace | Technorizon.fr"><meta property="og:description" content="Envoyez votre message ou votre dédicace à Technorizon.fr et partagez-la avec les auditeurs de la web-radio."><meta property="og:url" content="https://technorizon.fr/dedicaces.html"><meta property="og:image" content="https://technorizon.fr/ImageLogoFinal.png"><meta property="og:image:secure_url" content="https://technorizon.fr/ImageLogoFinal.png"><meta property="og:image:type" content="image/png"><meta property="og:image:alt" content="Technorizon.fr — La musique sans frontières"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Envoyez votre dédicace | Technorizon.fr"><meta name="twitter:description" content="Envoyez votre message ou votre dédicace à Technorizon.fr et partagez-la avec les auditeurs de la web-radio."><meta name="twitter:image" content="https://technorizon.fr/ImageLogoFinal.png"></head><body><div class="page"><div class="v2-background"></div><div class="shade"></div><main class="box"><div class="top"><a href="index.html" class="back" id="back">← Retour à l'accueil</a><div class="lang-switch"><button id="frBtn">🇫🇷 Français</button><span>|</span><button id="enBtn">🇬🇧 English</button></div></div><h1 id="title">DÉDICACES</h1><p class="intro" id="intro">Envoie ton message à Technorizon.fr</p><form id="form"><div class="field"><label for="prenom" id="labelName">Prénom</label><input id="prenom" maxlength="30" required></div><div class="field"><label for="ville" id="labelCity">Ville</label><input id="ville" maxlength="40"></div><div class="field"><label for="message" id="labelMessage">Dédicace</label><textarea id="message" maxlength="300" required></textarea></div><button class="send" id="send" type="submit">Envoyer ma dédicace</button><div id="status" class="status"></div></form></main></div><script>const t={fr:{back:"← Retour à l'accueil",title:'DÉDICACES',intro:'Envoie ton message à Technorizon.fr',name:'Prénom',city:'Ville',message:'Dédicace',send:'Envoyer ma dédicace',sending:'Envoi en cours…',success:'Dédicace envoyée ✓',error:"Impossible d'envoyer la dédicace pour le moment."},en:{back:'← Back to home',title:'DEDICATIONS',intro:'Send your message to Technorizon.fr',name:'First name',city:'City',message:'Dedication',send:'Send my dedication',sending:'Sending…',success:'Dedication sent ✓',error:'Unable to send your dedication at the moment.'}};const form=document.getElementById('form'),status=document.getElementById('status'),frBtn=document.getElementById('frBtn'),enBtn=document.getElementById('enBtn');const savedSiteLanguage=localStorage.getItem('technorizon-lang');let lang=['fr','en'].includes(savedSiteLanguage)?savedSiteLanguage:'fr';function render(){const x=t[lang];document.documentElement.lang=lang;document.title=(lang==='fr'?'Dédicaces':'Dedications')+' | Technorizon.fr';back.textContent=x.back;title.textContent=x.title;intro.textContent=x.intro;labelName.textContent=x.name;labelCity.textContent=x.city;labelMessage.textContent=x.message;send.textContent=x.send;frBtn.classList.toggle('active',lang==='fr');enBtn.classList.toggle('active',lang==='en');status.textContent=''}function setLang(l){lang=l;localStorage.setItem('technorizon-lang',l);render()}frBtn.onclick=()=>setLang('fr');enBtn.onclick=()=>setLang('en');render();form.addEventListener('submit',async e=>{e.preventDefault();status.textContent=t[lang].sending;try{const r=await fetch('/api/dedicaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:prenom.value.trim(),ville:ville.value.trim(),message:message.value.trim()})});if(!r.ok)throw Error();status.textContent=t[lang].success;form.reset()}catch(e){status.textContent=t[lang].error}})</script></body></html>
