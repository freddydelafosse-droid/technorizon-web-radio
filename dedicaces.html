<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dédicaces | Technorizon.fr</title><link rel="stylesheet" href="style-v2.css?v=7"><style>.page{min-height:100vh;padding:35px 18px;position:relative;isolation:isolate}.page .v2-background{position:fixed;inset:0;z-index:-2;background:url('Image principale V2 Technorizon.png') center top/cover no-repeat}.box{width:min(650px,100%);margin:auto;padding:32px;border:1px solid rgba(0,234,255,.35);border-radius:22px;background:rgba(2,12,26,.84);backdrop-filter:blur(14px)}.back{color:#dce9f2;text-decoration:none}.box h1{text-align:center;color:#fff;letter-spacing:4px}.box p{text-align:center;color:#a9bac9}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;color:#00eaff;font-size:12px;text-transform:uppercase;letter-spacing:1px}.field input,.field textarea{width:100%;padding:13px;border:1px solid rgba(0,234,255,.25);border-radius:12px;background:rgba(0,5,15,.72);color:#fff;font:inherit}.field textarea{min-height:120px;resize:vertical}.send{display:block;margin:20px auto 0;padding:12px 24px;border:1px solid rgba(0,234,255,.5);border-radius:999px;background:linear-gradient(90deg,rgba(0,234,255,.18),rgba(255,31,157,.16));color:#fff;font-weight:700;cursor:pointer}.status{text-align:center;margin-top:15px;color:#a9bac9}@media(max-width:760px){.page .v2-background{background-image:url('Fond-Smartphones.png')}.box{padding:24px 17px}}</style></head><body><div class="page"><div class="v2-background"></div><main class="box"><a href="index.html" class="back">← Retour à Technorizon</a><h1>DÉDICACES</h1><p>Envoie ton message à Technorizon.fr</p><form id="form"><div class="field"><label for="prenom">Prénom</label><input id="prenom" maxlength="30" required></div><div class="field"><label for="ville">Ville</label><input id="ville" maxlength="40"></div><div class="field"><label for="message">Dédicace</label><textarea id="message" maxlength="300" required></textarea></div><button class="send" type="submit">Envoyer ma dédicace</button><div id="status" class="status"></div></form></main></div><script>const form=document.getElementById('form'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Envoi en cours…';try{const r=await fetch('/api/dedicaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:document.getElementById('prenom').value.trim(),ville:document.getElementById('ville').value.trim(),message:document.getElementById('message').value.trim()})});if(!r.ok)throw Error();status.textContent='Dédicace envoyée ✓';form.reset()}catch(e){status.textContent="Impossible d'envoyer la dédicace pour le moment."}});</script></body></html>
