<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dédicaces | Technorizon.fr</title><link rel="icon" type="image/jpeg" href="Logo-Officiel-Technorizon.jpg"><link rel="stylesheet" href="style-v2.css?v=10"><style>.page{min-height:100vh;padding:35px 18px;position:relative;isolation:isolate}.page .v2-background{position:fixed;inset:0;z-index:-2;background:url('Image principale V2 Technorizon.png') center top/cover no-repeat}.box{width:min(650px,100%);margin:auto;padding:32px;border:1px solid rgba(0,234,255,.35);border-radius:22px;background:rgba(2,12,26,.84);backdrop-filter:blur(14px)}.back{color:#dce9f2;text-decoration:none}.lang-switch{display:flex;justify-content:center;align-items:center;gap:8px;margin:10px 0 18px;color:#8293a4;font-size:12px}.lang-switch button{border:0;background:none;color:#a9bac9;cursor:pointer;padding:5px 7px;font:inherit}.lang-switch button.active{color:#fff;text-shadow:0 0 9px rgba(0,234,255,.6)}.box h1{text-align:center;color:#fff;letter-spacing:4px}.box p{text-align:center;color:#a9bac9}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;color:#00eaff;font-size:12px;text-transform:uppercase;letter-spacing:1px}.field input,.field textarea{width:100%;padding:13px;border:1px solid rgba(0,234,255,.25);border-radius:12px;background:rgba(0,5,15,.72);color:#fff;font:inherit}.field textarea{min-height:120px;resize:vertical}.send{display:block;margin:20px auto 0;padding:12px 24px;border:1px solid rgba(0,234,255,.5);border-radius:999px;background:linear-gradient(90deg,rgba(0,234,255,.18),rgba(255,31,157,.16));color:#fff;font-weight:700;cursor:pointer}.status{text-align:center;margin-top:15px;color:#a9bac9}@media(max-width:760px){.page .v2-background{background-image:url('Fond-Smartphones.png')}.box{padding:24px 17px}}</style></head><body><div class="page"><div class="v2-background"></div><main class="box"><a href="index.html" class="back" id="back">← Retour à Technorizon</a><div class="lang-switch"><button id="frBtn">🇫🇷 Français</button><span>|</span><button id="enBtn">🇬🇧 English</button></div><h1 id="title">DÉDICACES</h1><p id="intro">Envoie ton message à Technorizon.fr</p><form id="form"><div class="field"><label for="prenom" id="labelName">Prénom</label><input id="prenom" maxlength="30" required></div><div class="field"><label for="ville" id="labelCity">Ville</label><input id="ville" maxlength="40"></div><div class="field"><label for="message" id="labelMessage">Dédicace</label><textarea id="message" maxlength="300" required></textarea></div><button class="send" id="send" type="submit">Envoyer ma dédicace</button><div id="status" class="status"></div></form></main></div><script>
const t={fr:{back:'← Retour à Technorizon',title:'DÉDICACES',intro:'Envoie ton message à Technorizon.fr',name:'Prénom',city:'Ville',message:'Dédicace',send:'Envoyer ma dédicace',sending:'Envoi en cours…',success:'Dédicace envoyée ✓',error:"Impossible d'envoyer la dédicace pour le moment."},en:{back:'← Back to Technorizon',title:'DEDICATIONS',intro:'Send your message to Technorizon.fr',name:'First name',city:'City',message:'Dedication',send:'Send my dedication',sending:'Sending…',success:'Dedication sent ✓',error:'Unable to send your dedication at the moment.'}};const form=document.getElementById('form'),status=document.getElementById('status'),frBtn=document.getElementById('frBtn'),enBtn=document.getElementById('enBtn');let lang=localStorage.getItem('technorizon-lang')||'fr';function render(){const x=t[lang];document.documentElement.lang=lang;document.title=(lang==='fr'?'Dédicaces':'Dedications')+' | Technorizon.fr';document.getElementById('back').textContent=x.back;document.getElementById('title').textContent=x.title;document.getElementById('intro').textContent=x.intro;document.getElementById('labelName').textContent=x.name;document.getElementById('labelCity').textContent=x.city;document.getElementById('labelMessage').textContent=x.message;document.getElementById('send').textContent=x.send;frBtn.classList.toggle('active',lang==='fr');enBtn.classList.toggle('active',lang==='en');status.textContent=''}function setLang(l){lang=l;localStorage.setItem('technorizon-lang',l);render()}frBtn.onclick=()=>setLang('fr');enBtn.onclick=()=>setLang('en');render();form.addEventListener('submit',async e=>{e.preventDefault();status.textContent=t[lang].sending;try{const r=await fetch('/api/dedicaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenom:document.getElementById('prenom').value.trim(),ville:document.getElementById('ville').value.trim(),message:document.getElementById('message').value.trim()})});if(!r.ok)throw Error();status.textContent=t[lang].success;form.reset()}catch(e){status.textContent=t[lang].error}});
</script></body></html>
